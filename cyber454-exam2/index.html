t(auto-fit,minmax(240px,1fr));gap:18px}.card{background:var(--card);border:1px solid var(--line);border-radius:19px;padding:24px;box-shadow:var(--shadow);margin-bottom:18px}.card p{max-width:78ch}.number{font:600 40px Georgia,serif}.weights{display:flex;height:10px;border-radius:20px;overflow:hidden;margin:20px 0}.weights span{background:var(--green);opacity:var(--o)}label{font-weight:600}select,input[type=search]{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px;max-width:100%}.toolbar{display:flex;flex-wrap:wrap;gap:14px;align-items:center;margin-bottom:22px}.toolbar input{flex:1;min-width:180px}.notice{border-left:4px solid #ba8b31;padding:12px 18px;background:var(--gold);border-radius:4px;margin:18px 0;font-size:15px}.lesson{scroll-margin-top:100px}.source{font-size:12px;color:var(--muted);margin-top:18px}.lesson p{white-space:pre-line}.flash{min-height:280px;width:100%;text-align:left;display:block;padding:30px;border-radius:20px;background:var(--card)}.flash .front{font:600 27px/1.4 Georgia,serif}.answer{background:var(--soft);padding:18px;border-radius:12px;margin:20px 0 0}.options{display:grid;gap:12px}.options button{text-align:left;padding:16px}.options .selected{border:2px solid var(--green);background:var(--soft)}.correct{border:2px solid var(--green)!important}.incorrect{border:2px solid var(--bad)!important}.feedback{padding:18px;background:var(--soft);margin-top:18px;border-radius:12px}.progress{height:7px;background:var(--line);border-radius:20px;margin:16px 0}.progress span{display:block;background:var(--green);height:100%;border-radius:20px}details{border-top:1px solid var(--line);padding:14px 0}summary{cursor:pointer;font-weight:600}table{border-collapse:collapse;width:100%;font-size:15px}td,th{text-align:left;padding:10px;border-bottom:1px solid var(--line)}.scroll{overflow:auto}footer{font-size:13px;color:var(--muted);margin-top:30px}code,pre{font-family:ui-monospace,Consolas,monospace}pre{overflow:auto;white-space:pre-wrap;background:var(--soft);padding:18px;border-radius:10px}.hidden{display:none!important}.reading{max-width:840px;margin:auto}.check{display:flex;gap:10px;align-items:flex-start;font-size:16px;margin:14px 0}.check input{margin-top:8px;width:18px;height:18px;accent-color:var(--green)}@media(max-width:600px){header{padding:24px 18px 18px}main{padding:20px 16px 50px}nav .row{padding:8px 12px;gap:3px}nav button{padding:8px 12px;font-size:15px}.card{padding:19px}.flash{padding:22px}.flash .front{font-size:23px}.toolbar{gap:10px}h2{font-size:27px}}@media print{nav,header button,.toolbar,.noprint,footer{display:none!important}body{background:white;color:black;font-size:12pt}main,header{max-width:none;padding:0}.card{border:0;box-shadow:none;padding:0;margin:20px 0;break-inside:avoid}.reading{max-width:none}.notice{border:1px solid gray;background:white}details{display:none}}

<header><div class="row between"><span class="eyebrow">CYBER 454 / EXAM 02</span><button id="theme" aria-label="Toggle dark mode">Light / dark</button></div><h1>A clearer path to Thursday.</h1><p>Chapters 5–9, explained simply. Read it, recall it, then test it.</p><div class="row"><span class="badge">Thu, Oct 29 · 1:35 PM</span><span class="badge">Olmsted E-236</span><span class="badge gold">100 exam points</span></div></header>
<nav aria-label="Study modes"><div class="row" id="nav"></div></nav><main id="main"></main>
<script>
const DATA = {"topics": [{"id": "t1", "ch": 5, "title": "Deletion is not erasure", "ref": "3–10", "body": "Think of a file system as a library catalog. Deleting an entry can remove the directions to a book without destroying its pages. A normal deletion generally makes storage reusable; recoverable bytes may remain until overwritten or otherwise erased. Stop unnecessary writes, acquire an image, verify its hash, and recover to a different destination. Recovery is a possibility, not a promise. SSD TRIM and garbage collection can reduce recovery opportunities.", "q": "Why may a normally deleted file still be recoverable?", "a": "Its bytes may remain until its storage is reused.", "wrong": ["Deletion always makes an automatic backup.", "All deleted files are permanently stored in RAM.", "Deletion encrypts the file without removing it."]}, {"id": "t2", "ch": 5, "title": "Sectors, clusters, and slack", "ref": "4–5", "body": "A sector is a storage unit at the device level. A cluster is a file-system allocation unit made of one or more sectors. A small file may occupy only part of its final cluster: the unused tail is file slack. Unallocated space consists of clusters not assigned to active files. An HDD uses magnetic platters and heads; an SSD uses flash chips and a controller. Both can hold evidence, but their deletion behavior differs.", "q": "Unused bytes after a file ends inside its allocated cluster are called what?", "a": "File slack", "wrong": ["Unallocated clusters", "The master boot record", "A hard link"]}, {"id": "t3", "ch": 5, "title": "FAT chains", "ref": "6–8", "body": "FAT16/FAT32 use a file allocation table to track a chain of clusters. Each chain entry points toward the next cluster; EOC marks the end. Other values identify free, reserved, or bad clusters. Deleting a file releases its chain for reuse. If the chain information is lost, fragmentation can make recovery harder even when some content remains. FAT is not limited to old Windows installations; the slides use older Windows to introduce it.", "q": "What does EOC identify in a FAT chain?", "a": "The end of the cluster chain", "wrong": ["An encrypted operating-system cache", "A damaged sector only", "The beginning of every directory"]}, {"id": "t4", "ch": 5, "title": "NTFS: MFT and bitmap", "ref": "9–10", "body": "The Master File Table (MFT) stores records describing files and directories, including names, timestamps, attributes, and data-location information. The volume cluster bitmap tracks allocation. Moving an item to the Recycle Bin is different from permanently deleting it. Technical correction: NTFS deletion clears the record’s in-use state; the slide’s special-character description should not be treated as the general NTFS mechanism. The important exam concept is that deletion need not immediately erase content.", "q": "Which NTFS structure describes individual files and their metadata?", "a": "Master File Table (MFT)", "wrong": ["SPF record", "Linux inode bitmap only", "POP3 mailbox"]}, {"id": "t5", "ch": 5, "title": "Windows recovery tools", "ref": "11–25", "body": "Recognize the tool-to-task matches from the slides: DiskDigger scans for recoverable files; WinUndelete offers a wizard for choosing a drive, file types, and restore destination; FreeUndelete is another recovery utility; OSForensics includes deleted-file searching; Autopsy provides forensic analysis and recovery from images. Product editions, pricing, and exact screens change, so study their roles. Recover onto another disk or working destination to avoid overwriting the evidence you need.", "q": "Which pair includes full forensic tools with deleted-file recovery?", "a": "OSForensics and Autopsy", "wrong": ["PsLoggedOn and netstat", "SPF and DKIM", "GRUB and LILO"]}, {"id": "t6", "ch": 5, "title": "Linux inodes and links", "ref": "26–27", "body": "An inode holds file metadata and references to data; directory entries associate names with inode numbers. Hard links are additional names for the same underlying file. Removing one name decrements the link count. Storage becomes reclaimable after the last hard link is removed and no process still holds the file open. A symbolic or soft link points to a path and does not preserve the target in the same way. The slides simplify deletion to the reference count reaching zero.", "q": "A file has two hard links. One is removed. What normally happens?", "a": "The remaining hard link still accesses the file.", "wrong": ["Both names are automatically erased.", "The inode becomes a Windows MFT record.", "A soft link is automatically created."]}, {"id": "t7", "ch": 5, "title": "Linux recovery with grep and extundelete", "ref": "28–29", "body": "The slides propose reducing writes with legacy single-user mode (init 1), then searching raw data. In grep -i -a -B10 -A100 \"forensics\" image.dd, -i ignores case, -a treats input as text, and -B/-A include lines before/after the match. This extracts matching content, not necessarily a complete original file. extundelete targets ext3/ext4 recovery; the lecture example is extundelete /dev/sda4 --restore-all. Actual recovery depends on filesystem features and remaining metadata. Use copies for practice.", "q": "Which utility in Chapter 5 targets ext3/ext4 undelete?", "a": "extundelete", "wrong": ["ListDLLs", "MacDrive", "PsInfo"]}, {"id": "t8", "ch": 5, "title": "Scalpel and file carving", "ref": "30–32, 44", "body": "File carving recognizes content patterns such as headers and footers rather than relying on a healthy directory entry. Scalpel workflow: install; enable the desired file formats in /etc/scalpel/scalpel.conf; choose an empty output directory; run scalpel against the image with -o for output. Carving is useful when metadata is damaged, but may lose filenames, timestamps, or fragmented pieces. It cannot reconstruct bytes that have actually been overwritten merely by recognizing a header.", "q": "Which recovery method searches file signatures rather than intact directory metadata?", "a": "File carving", "wrong": ["Email remailing", "Registry editing", "Volume formatting"]}, {"id": "t9", "ch": 5, "title": "Signature memory sheet", "ref": "45–46", "body": "Memorize the abbreviated prefixes shown in class: JPEG FF D8; BMP 42 4D; EXE 4D 5A; GIF 47 49; MP3 with ID3 49 44; PDF 25 50; ZIP 50 4B; PNG 89 50; WAV and AVI 52 49. These are short clues, not complete unique validators. WAV and AVI both use RIFF and need later type bytes to distinguish them. Not every MP3 starts with an ID3 tag. A filename extension can be renamed; content signatures give another clue.", "q": "The class prefix 4D 5A most strongly suggests which file type?", "a": "Windows EXE", "wrong": ["JPEG", "PDF", "PNG"]}, {"id": "t10", "ch": 5, "title": "Physical versus logical damage", "ref": "36–39", "body": "Physical damage involves hardware such as a drive controller, read/write head, or platter. Logical damage affects structures such as file-system metadata, even if the hardware still reads. The slides show connecting a drive to a test system, attempting access, imaging, and repair options. For evidence handling, preserve and image before making repairs when feasible; head or platter replacement belongs in a qualified recovery lab. Power failures during writes can leave logical structures inconsistent.", "q": "A healthy drive has corrupted directory structures after a power outage. What kind of damage is this?", "a": "Logical damage", "wrong": ["A broken read/write head", "A cracked platter", "A failed keyboard"]}, {"id": "t11", "ch": 5, "title": "Consistency checking", "ref": "39–42", "body": "Windows chkdsk, Linux fsck, and macOS Disk Utility are associated with file-system checking or repair. The Sleuth Kit and TestDisk also appear in the recovery discussion. A consistency checker compares structures against the filesystem rules; for example, . should refer to the directory itself and .. to its parent. Repairs may discard inconsistent entries, so a repair can change or destroy evidence. Journaling and battery-backed power reduce corruption risk but do not replace backups.", "q": "Why should a forensic examiner avoid immediately repairing the original evidence disk?", "a": "Repair may change or discard evidence.", "wrong": ["Repair always restores every deleted file.", "A checker cannot read directory structures.", "Hashing becomes unnecessary after repair."]}, {"id": "t12", "ch": 5, "title": "Zero-knowledge analysis", "ref": "43", "body": "Here, zero-knowledge analysis means recovery with few assumptions about the damaged file system, not a cryptographic zero-knowledge proof. The tool scans and uses knowledge of valid filesystem structures to reconstruct organization. It is slower than ordinary consistency checking but can help when existing metadata is severely destroyed. Compare: consistency checking trusts enough structure to check it; reconstruction starts with less trust; carving focuses on individual file content.", "q": "Which approach makes few assumptions about surviving filesystem structures?", "a": "Zero-knowledge analysis", "wrong": ["Normal consistency checking only", "SMTP relay", "A Recycle Bin restore only"]}, {"id": "t13", "ch": 5, "title": "macOS recovery overview", "ref": "33–35", "body": "The slides connect macOS recovery to its UNIX heritage and HFS+/APFS storage. They name MacKeeper as a historical recovery example. Do not make a recovery guarantee from a product name: filesystem type, encryption, snapshots, overwriting, and SSD behavior matter. First check Trash and available copies, then consider image-based recovery. A surviving backup can restore content that ordinary undelete cannot.", "q": "What most directly limits recovery of the original deleted bytes?", "a": "Those bytes have been overwritten or erased.", "wrong": ["The filename contains spaces.", "The file was placed in a folder.", "The investigator knows the file type."]}, {"id": "t14", "ch": 6, "title": "Windows versions and boot context", "ref": "3–11", "body": "The slides survey Windows 3.x, 95/NT, 98/2000, XP/Server 2003, Vista/7/Server 2008, 10/Server 2016, Server 2019, 11, Server 2022 and 2025. Establish the examined OS version because paths, artifacts, and boot systems differ. Ask whether the firewall and EFS are enabled. The lecture boot model is legacy: BIOS → POST → MBR/boot loader → NTLDR and boot.ini → kernel, HAL, Registry, subsystem. Modern Windows uses Boot Manager and winload with BIOS or UEFI; do not apply NTLDR to every version.", "q": "Which boot sequence vocabulary belongs to the legacy model in the slides?", "a": "NTLDR and boot.ini", "wrong": ["DKIM and IMAP", "TCC and knowledgeC", "Scalpel and EOC"]}, {"id": "t15", "ch": 6, "title": "Important Windows processes", "ref": "9–11", "body": "Know the roles: ntoskrnl.exe is the Windows kernel; hal.dll provides the hardware abstraction layer; smss.exe manages sessions; winlogon.exe supports interactive logon; lsass.exe handles local security; explorer.exe provides the desktop/file shell; csrss.exe is the client/server runtime subsystem. The slide spells the last item Crss.exe. Legacy ntdetect.com detects hardware; ntbootdd.sys relates to certain older boot configurations. fsutil can report filesystem information. A familiar process name alone does not prove a process is legitimate.", "q": "Which listed file is the Windows kernel?", "a": "ntoskrnl.exe", "wrong": ["explorer.exe", "pagefile.sys", "index.dat"]}, {"id": "t16", "ch": 6, "title": "Collect volatile evidence early", "ref": "12–13", "body": "Volatile evidence includes RAM contents, running processes, active connections, and logged-on users. Power loss can remove it. The chapter workflow is collect a memory dump → compute its hash → analyze in an isolated environment. Document the collection because live acquisition itself changes some state. A hash helps verify that the collected image has not changed; it does not prove that every interpretation of it is correct.", "q": "What is the chapter’s memory-analysis sequence?", "a": "Capture memory, hash the capture, analyze in isolation", "wrong": ["Shut down, clear logs, then capture RAM", "Edit memory first, then trust the filename", "Analyze only the Recycle Bin"]}, {"id": "t17", "ch": 6, "title": "Stack versus heap", "ref": "13", "body": "The stack organizes function-call state with last-in, first-out behavior: the newest call is unwound first. The heap provides dynamically allocated storage that can remain across function calls until released. Both may contain useful values or strings. Neither is a separate permanent archive. Memory evidence must be interpreted in process context rather than assuming every string was intentionally saved.", "q": "Which memory organization is associated with last-in, first-out behavior?", "a": "Stack", "wrong": ["Heap", "Volume Shadow Copy", "MFT"]}, {"id": "t18", "ch": 6, "title": "Match live-response tools", "ref": "14–19", "body": "PsList lists process information. PsInfo reports system/OS information. ListDLLs reports loaded DLLs. PsLoggedOn reports logon information. netstat reports network connections and listening endpoints. Example: investigate a suspicious network connection by combining netstat results with process information instead of treating the IP address alone as proof of malware.", "q": "Which tool is the direct match for loaded dynamic-link libraries?", "a": "ListDLLs", "wrong": ["PsInfo", "PsLoggedOn", "netstat"]}, {"id": "t19", "ch": 6, "title": "Paging versus hibernation", "ref": "20–21", "body": "pagefile.sys is disk-backed paging space that supports virtual memory and can retain memory fragments. hiberfil.sys stores hibernation-related memory state and can contain application artifacts. Depending on format and tool support, an examiner may convert and analyze a hibernation file or search strings. Neither is identical to a fresh live RAM capture. The files are commonly at the system drive root, not necessarily inside the Windows folder.", "q": "Which file is associated with hibernation rather than ordinary paging?", "a": "hiberfil.sys", "wrong": ["pagefile.sys", "boot.ini", "index.dat"]}, {"id": "t20", "ch": 6, "title": "Volume Shadow Copy", "ref": "22", "body": "Volume Shadow Copy Service (VSS) supports point-in-time volume snapshots. Older versions of changed data can help reconstruct or recover prior file states. The slide describes daily changed-block copying; snapshot frequency actually depends on configuration and the requester. A snapshot is different from RAM, a pagefile, or a deleted-file list. Investigate whether snapshots exist instead of assuming they are always available.", "q": "Where might an examiner find a previous state of a file?", "a": "A volume shadow copy", "wrong": ["Only the active TCP connection list", "An SPF record", "The CPU instruction register only"]}, {"id": "t21", "ch": 6, "title": "Windows event logs", "ref": "23–24", "body": "Event Viewer displays logs. Security relates to audited security events; Application to application events; System to OS/components; ForwardedEvents to collected remote events; Applications and Services to more specific providers. For a timeline, correlate relevant entries with user, process, and file evidence. Logging configuration and retention affect what exists. Absence of a log entry is not automatically absence of activity.", "q": "Which Windows interface is used to inspect event logs?", "a": "Event Viewer", "wrong": ["Scalpel", "GRUB", "DiskDigger only"]}, {"id": "t22", "ch": 6, "title": "User folders and program folders", "ref": "25", "body": "C:\\Users contains profiles for multiple users; C:\\Users\\username\\Documents holds one user’s documents. C:\\Program Files normally holds applications, and on 64-bit Windows C:\\Program Files (x86) conventionally holds 32-bit applications. Older Windows used Documents and Settings. Examine all relevant profiles, not just the currently logged-on user. The slide’s combined Windows documents and settings path is not a universal directory.", "q": "On 64-bit Windows, which directory conventionally holds 32-bit applications?", "a": "C:\\Program Files (x86)", "wrong": ["C:\\Users\\Public only", "C:\\Windows\\Logs only", "C:\\$MFT"]}, {"id": "t23", "ch": 6, "title": "Unallocated space, slack, and ADS", "ref": "26", "body": "Unallocated space is available for new allocation; slack is unused space within an allocated file’s last cluster. Both may hold remnants. NTFS alternate data streams (ADS) are additional named streams associated with a file and may store data separate from its default stream. ADS are not the same as deleted data. FTK indexing makes keyword searching across an image more efficient; a keyword match still needs context and validation.", "q": "An extra named stream attached to an NTFS file is what?", "a": "An alternate data stream", "wrong": ["A Linux runlevel", "An email Received field", "A volume partition table"]}, {"id": "t24", "ch": 6, "title": "Legacy browser artifact: index.dat", "ref": "27–28", "body": "index.dat belongs to legacy Internet Explorer activity, not Microsoft Edge. The slides associate it with browsing addresses, searches, and recently accessed items and name Window Washer as a viewing example. Identify the browser and version before selecting artifact locations. Finding a historical URL is evidence of recorded activity, not by itself proof that a particular person intentionally viewed the page.", "q": "Which browser family is associated with the chapter’s index.dat discussion?", "a": "Legacy Internet Explorer", "wrong": ["Microsoft Edge exclusively", "Safari exclusively", "Every browser without exception"]}, {"id": "t25", "ch": 6, "title": "Copy/move permissions and MAC times", "ref": "29–30", "body": "The lecture rule for the same NTFS volume: a normal copy inherits destination permissions; a normal move retains existing permissions. MAC in this context means Modified, Accessed, Created—not a network MAC address. Created refers to creation on that volume; Modified to content change; Accessed to access activity. Tools, OS settings, copying, and timestamp manipulation can complicate a timeline. Do not interpret a timestamp without context.", "q": "Under the chapter’s same-volume rule, a normally moved file does what?", "a": "Retains its existing permissions", "wrong": ["Always removes all permissions", "Always inherits destination permissions as a new copy", "Converts its permissions to SPF"]}, {"id": "t26", "ch": 6, "title": "Registry root keys", "ref": "31–35", "body": "The Registry stores configuration for the system, users, hardware, and programs. HKLM = machine-wide settings; HKCU = current user; HKU = loaded users; HKCR = classes/file associations; HKCC = current hardware configuration. The slides abbreviate HKEY_CURRENT_CONFIG as HCU; HKCC is the usual abbreviation. Registry evidence can point to USB use, wireless connections, application settings, recent activity, and removed software.", "q": "Which Registry root is most directly associated with machine-wide configuration?", "a": "HKEY_LOCAL_MACHINE", "wrong": ["HKEY_CURRENT_USER", "HKEY_CLASSES_ROOT only", "HKEY_CURRENT_CONFIG only"]}, {"id": "t27", "ch": 6, "title": "Control sets", "ref": "33–34", "body": "The slides present ControlSet001 as the booted set and ControlSet002 as last known good, CurrentControlSet as a reference to the active set, and Clone as a boot-time copy. Treat the numbering as a lecture example, not a fixed mapping on every Windows installation. The key exam idea is that CurrentControlSet selects active control configuration; different stored sets can support startup and recovery.", "q": "What is CurrentControlSet conceptually?", "a": "A reference to the active control set", "wrong": ["The folder containing every user document", "A copy of the email server", "The FAT end-of-chain marker"]}, {"id": "t28", "ch": 6, "title": "Application activity artifacts", "ref": "36–43", "body": "Use several artifacts together. UserAssist can record GUI-launched application activity. Prefetch can support application execution analysis and may include run information. Shimcache/AppCompatCache holds compatibility-related program metadata; its presence alone is not universal proof of execution. Amcache stores program/file inventory metadata. ShellBags preserve folder-view information and can help identify folders browsed. SRUM concerns resource usage. BAM/DAM relate to background/desktop activity management. Availability and meanings vary by Windows version.", "q": "Which artifact is especially associated with folder browsing/view settings?", "a": "ShellBags", "wrong": ["SPF", "Volume boot blocks", "POP3"]}, {"id": "t29", "ch": 6, "title": "A Windows investigation in plain language", "ref": "12–43", "body": "Suppose a user denies running a program and copying files. Preserve live memory and connections if appropriate; image the disk; inspect all relevant user profiles; correlate application artifacts, USB-related Registry data, file timestamps, and event logs. A single artifact can be ambiguous. A stronger conclusion connects multiple independent records with compatible timestamps and documented acquisition. Separate observed facts from inferred actions.", "q": "Why correlate several Windows artifacts?", "a": "One artifact may be incomplete or ambiguous.", "wrong": ["Multiple artifacts eliminate the need to preserve originals.", "Every artifact records exactly the same events.", "File names alone conclusively identify the user."]}, {"id": "t30", "ch": 7, "title": "Linux foundations, shells, and desktops", "ref": "3–4, 11–14, 18", "body": "Linux is a kernel used in distributions such as Ubuntu, Debian, Fedora, Mint, RHEL, openSUSE, and CentOS. The lecture timeline connects UNIX, GNU, Minix, and Linux (1991). A shell interprets commands: Bash, sh, ksh, and csh are examples. A graphical desktop is a different layer: GNOME, KDE Plasma, CDE, Enlightenment, Cinnamon, and LXDE. Cinnamon is associated with Mint; LXDE emphasizes low resource use. Do not confuse a distribution, a shell, and a desktop.", "q": "Which item is a shell rather than a distribution or desktop?", "a": "Bash", "wrong": ["Ubuntu", "GNOME", "KDE Plasma"]}, {"id": "t31", "ch": 7, "title": "Navigation and directory listing", "ref": "5–6", "body": "ls lists entries; ls -l gives a long listing; ls -a includes hidden dot-names. cd changes directory: cd .. moves to the parent, cd / to the filesystem root, and cd ~ to your home. mkdir creates a directory; mkdir -p also creates missing parents. Correction: ls -ls means long listing plus allocated-size information; use ls -lS to sort by size. Case matters in command flags.", "q": "Which command includes hidden dot-files in a directory listing?", "a": "ls -a", "wrong": ["cd ..", "mkdir -p", "ls -S alone"]}, {"id": "t32", "ch": 7, "title": "Copying, moving, and deleting", "ref": "5–7", "body": "cp copies; cp -R recursively copies directory contents. mv moves or renames. rm removes file names; rm -i prompts; rm -r operates recursively. rmdir removes empty directories, not arbitrary populated directories. These change data, so recognize them on an exam but practice on disposable files or copies. A command’s name does not make it a forensic acquisition tool.", "q": "Which command removes an empty directory?", "a": "rmdir", "wrong": ["mkdir", "pwd", "lsof"]}, {"id": "t33", "ch": 7, "title": "Processes: ps, pstree, top, pgrep", "ref": "8–9, 35–37", "body": "ps provides a process snapshot; ps aux is a common broad listing. pstree shows parent-child relationships. top refreshes process/resource information interactively. pgrep locates process IDs by matching criteria. The slides simplify some ps flags; options differ between styles, so ps -a alone is not literally every process. If a shell unexpectedly launches an executable, the process tree helps connect them.", "q": "Which tool most directly shows which process launched another process?", "a": "pstree", "wrong": ["fsck", "lsattr", "fdisk"]}, {"id": "t34", "ch": 7, "title": "Open files, attributes, partitions, mounts", "ref": "9–10", "body": "lsof lists open files and the processes using them. lsattr lists filesystem attributes where supported. fdisk -l lists partition information; note the space before -l. mount attaches a filesystem at a mount point; the chapter example mounts a floppy at /mnt/floppy. fsck checks filesystem consistency and may modify structures depending on invocation. A mounted drive is not automatically read-only.", "q": "Which tool links open files to processes?", "a": "lsof", "wrong": ["lsattr", "fdisk -l", "mkdir"]}, {"id": "t35", "ch": 7, "title": "Legacy boot sequence", "ref": "15–16, 27", "body": "Study the class sequence: BIOS/POST → MBR → GRUB or LILO → kernel initialization → init → runlevel. The kernel manages hardware and core OS functions; the boot loader loads the kernel. /etc/inittab is part of the legacy init configuration. Modern distributions commonly use UEFI and systemd, so this is a course model rather than a universal boot recipe.", "q": "In the lecture Linux boot sequence, what loads before the kernel?", "a": "GRUB or LILO", "wrong": ["The email inbox", "A Windows UserAssist key", "The final graphical login only"]}, {"id": "t36", "ch": 7, "title": "Runlevels: memorize 0, 1, 3, 5, 6", "ref": "16", "body": "The slide’s traditional mapping is 0 halt, 1 single-user, 2 user-definable, 3 multiuser without GUI, 4 user-definable, 5 multiuser with GUI, 6 reboot. Its service directories follow /etc/rc.d/rcN.d. Memory cue: 0 stops, 1 is alone, 3 is text, 5 adds graphics, 6 restarts. These mappings vary by distribution; answer course-specific questions using the table.", "q": "According to the slide table, which runlevel is multiuser without a GUI?", "a": "3", "wrong": ["1", "5", "6"]}, {"id": "t37", "ch": 7, "title": "LVM and snapshots", "ref": "17", "body": "Logical Volume Management adds an abstraction between physical storage and logical volumes. The chapter emphasizes resizing storage and taking snapshots for backups. A snapshot captures a point-in-time view; it is not inherently an independent off-device backup. Forensics requires knowing which logical volumes and underlying physical devices hold the relevant data.", "q": "Which pair describes the chapter’s main LVM benefits?", "a": "Resizing volumes and taking snapshots", "wrong": ["Sending email and validating DKIM", "Launching GNOME and changing passwords", "Deleting logs and hiding partitions"]}, {"id": "t38", "ch": 7, "title": "ext3/ext4 journaling modes", "ref": "19", "body": "Journaling records pending changes to help recover consistency after a crash. In journal mode, file data and metadata are journaled; ordered mode journals metadata and orders data writes before related metadata commit; writeback mode journals metadata without that same ordering guarantee. The slide ranks journal as safest for this purpose and writeback as least safe. It lists ext4 limits of 1 EB volumes and 16 TB files; actual limits depend on features and configuration.", "q": "Which mode journals both file data and metadata?", "a": "Journal mode", "wrong": ["Ordered mode", "Writeback mode", "No-journal mode"]}, {"id": "t39", "ch": 7, "title": "Other file systems", "ref": "20", "body": "The slides describe ReiserFS as journaled and efficient with many small files. Berkeley Fast File System is associated with UFS and a bitmap for free-space tracking. Technical context: FFS/UFS comes from BSD/UNIX history, not originally from Linux. The central comparison is how a filesystem organizes data, tracks free storage, and supports recovery after interrupted writes.", "q": "Which filesystem does the lecture associate with many small files?", "a": "ReiserFS", "wrong": ["NTFS ADS", "APFS only", "FAT EOC"]}, {"id": "t40", "ch": 7, "title": "Linux log locations", "ref": "21–22", "body": "Learn the lecture matches: kern.log → kernel messages; lpr.log → printing; mail.* → email; mysql.* → database; apache2/* and lighttpd/* → web servers; apport.log → crashes; IDS logs → suspicious traffic. The slide lists fail.log for failed logins; actual systems may use auth.log, secure, btmp, faillog, or the system journal. Confirm the distribution and logging configuration rather than expecting every example path.", "q": "Which lecture log best matches kernel messages?", "a": "/var/log/kern.log", "wrong": ["/var/log/mail.*", "/var/log/apache2/*", "/var/log/lpr.log"]}, {"id": "t41", "ch": 7, "title": "Reading and investigating logs", "ref": "22, 35–36", "body": "less and more page through text. tail -f follows new lines as a file grows. grep searches matching content. dmesg displays the kernel ring buffer; dmesg | lpr sends that output to the print system. ls -al gives sizes that can reveal zero-byte logs, but a listing alone does not prove deliberate deletion. An unexplained gap, truncation, or binary content deserves comparison with rotated logs and other sources.", "q": "Which command follows new log lines live?", "a": "tail -f logfile", "wrong": ["mkdir logfile", "rm logfile", "cd logfile"]}, {"id": "t42", "ch": 7, "title": "Root, home, binaries, and configuration", "ref": "24–26, 30", "body": "/ is the filesystem root. /root is the root administrator’s home; /home commonly holds ordinary users’ homes. /bin contains essential command binaries; /sbin holds system-administration binaries. /etc stores system configuration. /usr holds shareable software and related data, not the normal collection of personal home directories. The slide’s /usr description needs that correction. Evidence in /etc may reveal altered services or startup configuration.", "q": "Where would you usually look for system configuration files?", "a": "/etc", "wrong": ["/dev", "/proc only", "/mnt only"]}, {"id": "t43", "ch": 7, "title": "Devices, boot files, and mount points", "ref": "28–29", "body": "/dev contains device nodes, such as disk interfaces. /boot contains boot-related files, often kernel images and boot-loader data. /mnt is a conventional temporary mount location; other mount locations exist, so it is not a complete inventory of mounted devices. The slides use older hd/fd naming examples; actual devices can appear as /dev/sda or /dev/nvme0n1 and partitions under those names.", "q": "Which directory contains device nodes?", "a": "/dev", "wrong": ["/root", "/usr/share", "/var/backups"]}, {"id": "t44", "ch": 7, "title": "Temporary files, backups, and spools", "ref": "30–31", "body": "/tmp holds temporary files and can be cleared at boot or by policy. /var/tmp is intended for temporary files surviving reboots; the slide’s 30-day cleanup is an example policy, not a universal guarantee. /var/backups may hold copies of system files. /var/spool contains queued work such as printing or mail. Collect transient data promptly and document actual retention settings.", "q": "Which directory is intended for temporary data that survives reboots?", "a": "/var/tmp", "wrong": ["/proc", "/dev", "/boot"]}, {"id": "t45", "ch": 7, "title": "proc, run, and tmpfs", "ref": "32–34", "body": "/proc exposes kernel/process state through a virtual filesystem. /run holds runtime state, commonly on volatile storage. tmpfs is memory-backed and its filesystem contents disappear when unmounted; collect relevant data before shutdown. Correction: Linux tmpfs can use swap, so “never written to disk” is too absolute. The lecture Volatility command is a version-specific analysis example, not a universal memory-capture command.", "q": "Why prioritize collecting relevant tmpfs content?", "a": "Its filesystem contents disappear on unmount or shutdown.", "wrong": ["It is always a permanent backup.", "It is an email archive format.", "It cannot contain user data."]}, {"id": "t46", "ch": 7, "title": "Identify files and search suspicious content", "ref": "35, 38–40", "body": "file examines content to identify type; an extension can lie. ELF is the common Linux executable format. The lecture combines find with file and grep ELF to locate executables, including in /tmp. find / -mtime -1 finds files modified within roughly the last 24 hours; it does not specifically mean newly created. find / -type d -name \".*\" locates dot-prefixed directories. -nouser/-nogroup can identify orphaned ownership references.", "q": "What does find / -mtime -1 primarily filter on?", "a": "Modification time within the last day", "wrong": ["Creation time only", "The owner’s last login", "File size greater than one MB"]}, {"id": "t47", "ch": 7, "title": "Scheduled tasks and user context", "ref": "35, 39–40", "body": "Check scheduled work for unexplained persistence. The run-together slide line should be read as three commands: crontab -l lists the current user’s cron jobs; atq lists queued at jobs; systemctl list-timers --all lists systemd timers. history can show shell command history, but may be incomplete. who shows logged-on users; su switches user context; kill sends a signal to a process. These are distinct tasks.", "q": "Which command lists systemd timers?", "a": "systemctl list-timers --all", "wrong": ["crontab -r", "lsattr /tmp", "file /etc/passwd"]}, {"id": "t48", "ch": 7, "title": "Linux recovery and forensic workflow", "ref": "41–49", "body": "The lecture’s manual recovery reduces activity using single-user mode, searches raw storage with grep, and examines recovered text. Prefer working from an acquired image with verified hashes. Kali includes tools useful for an independent second examination. The slides show legacy web-based Autopsy, a GUI for The Sleuth Kit: create a case, add a host, add an image, verify its hash, then analyze. A mounted image and a booted VM are different; a running guest may write, so preserve the original and use a working copy/overlay.", "q": "Why verify the forensic image’s hash?", "a": "To detect changes to the acquired image", "wrong": ["To automatically decrypt every file", "To prove who typed every command", "To convert Linux to Windows"]}, {"id": "t49", "ch": 7, "title": "Document the system and recognize advanced tools", "ref": "50", "body": "cat /etc/os-release identifies OS information; cat /etc/hostname reports the stored hostname; cat /etc/timezone may report timezone where that file exists. The slide also names older Sleuth Kit dcat, dls, dcalc, dstat and mmls: recognize data-unit inspection, listing, address translation, statistics, and volume-layout work. locate searches a filename database, which may be stale; xargs builds command arguments from input. Keep timezone context when joining evidence from different machines.", "q": "Which command reads the distribution identification file?", "a": "cat /etc/os-release", "wrong": ["cat /etc/hostname", "cat /etc/timezone", "pstree"]}, {"id": "t50", "ch": 8, "title": "Mac foundations and file systems", "ref": "3–11", "body": "The chapter surveys Apple history, OS X releases, and macOS through Tahoe. Core filesystem progression: MFS → HFS → HFS+ → APFS. HFS+ adds Unicode, long names, journaling, quotas, links, and aliases. APFS arrived with the High Sierra era and is distinct from HFS+. The slides list support for other filesystem formats such as ISO9660, MS-DOS/FAT, NTFS, UDF, and UFS; support and write capability depend on OS and drivers. Partition schemes include MBR, GPT, and Apple Partition Map.", "q": "Which is Apple’s newer filesystem contrasted with HFS+?", "a": "APFS", "wrong": ["ext3", "ReiserFS", "FAT16 only"]}, {"id": "t51", "ch": 8, "title": "HFS+ structures", "ref": "7–9", "body": "For the HFS+ model in class, sectors 0 and 1 are boot blocks and sector 2 contains the volume header. The allocation file tracks which allocation blocks are in use/free. HFS+ uses 32-bit allocation block addressing, names up to 255 characters, Unicode, hard/soft links, aliases, quotas, and journaling. An alias is a reference to an item, not another independent copy of its contents.", "q": "In the chapter’s HFS+ layout, what is in sector 2?", "a": "The volume header", "wrong": ["The SMTP queue", "The Windows Registry", "The Linux kernel ring buffer"]}, {"id": "t52", "ch": 8, "title": "Boot Camp and acquisition", "ref": "12, 20–22, 26, 29–32", "body": "Boot Camp can place Windows alongside macOS on supported Intel Macs; an examination may need both OS environments. The slides name MacQuisition for imaging and MacDrive/APFS for Windows for reading Apple filesystems from a Windows workstation. Target Disk Mode exposes a supported Mac’s storage to another Mac. Correction: it is not inherently a write blocker. Use a validated acquisition method and protect the source. Preserve a master image and analyze a copy; simply starting a VM does not guarantee immutability.", "q": "Why does Boot Camp matter to an examiner?", "a": "Relevant evidence may also exist in the installed Windows environment.", "wrong": ["It proves all files were deleted.", "It removes the need to image the drive.", "It means the computer cannot use macOS."]}, {"id": "t53", "ch": 8, "title": "Mac logs and useful paths", "ref": "13–19, 23", "body": "Map evidence to locations: /Users → user accounts/files; /Applications → installed apps; /Volumes → mounted volumes; /etc → configuration; /private/var/audit → audit records; /var/spool/cups → print spool information; /var/vm → swap/sleep-related evidence depending on version. User Library/Preferences can retain app settings, including traces after removal. Shell history depends on the shell, such as .bash_history or .zsh_history. Some slide paths contain typos or old examples; validate paths on the actual image.", "q": "Where should you look for mounted-volume entries on macOS?", "a": "/Volumes", "wrong": ["/Applications", "/System/SMTP", "/Windows"]}, {"id": "t54", "ch": 8, "title": "TCC and knowledgeC", "ref": "27–28", "body": "TCC means Transparency, Consent, and Control. Its database records privacy permission decisions for applications; the slides show system and user TCC.db locations under Library/Application Support/com.apple.TCC. knowledgeC.db is associated with the Knowledge framework and can record activity context; the chapter points to ~/Library/Application Support/Knowledge/. Availability varies by version. These artifacts help answer what apps were allowed to access and what activity context was recorded, not automatically who physically used the device.", "q": "Which database records application privacy-permission decisions?", "a": "TCC.db", "wrong": ["The FAT table", "index.dat", "The SPF zone"]}, {"id": "t55", "ch": 8, "title": "Mac shell commands", "ref": "24–25", "body": "date reports date/time context. ls /dev/disk? lists matching device names. system_profiler SPHardwareDataType reports hardware information; system_profiler SPSoftwareDataType reports software/system information. The slide line breaks split those DataType names; type each as one argument. The deck’s hdiutil partition example should be treated as a version-specific slide example; diskutil list is a common way to inspect disk/partition layout. Shell familiarity transfers from Linux, but paths and options can differ.", "q": "Which command requests Mac hardware information?", "a": "system_profiler SPHardwareDataType", "wrong": ["system_profiler SPSoftwareDataType", "tail -f /var/log/mail", "PsLoggedOn"]}, {"id": "t56", "ch": 8, "title": "Trash and undelete limits", "ref": "33–37", "body": "Start with the user’s Trash, commonly ~/.Trash; external volumes can have their own trash storage. Moving a file back out of Trash differs from recovering a file after permanent deletion. The slides name Disk Drill, Mac Undelete, and Free Undelete as recovery examples. Truly overwritten bytes are not recovered by ordinary undelete; seek surviving copies, snapshots, or fragments elsewhere. APFS, encryption, and SSD TRIM complicate recovery.", "q": "If a file is still in Trash, what is the simplest recovery concept?", "a": "Restore the existing item from Trash", "wrong": ["Reconstruct overwritten bytes by guessing", "Replace the disk platters immediately", "Disable every security feature first"]}, {"id": "t57", "ch": 8, "title": "Password recovery: understand the distinctions", "ref": "38–44", "body": "The slides cover authorized recovery: older Intel Command-R recovery, resetpassword, firmware-password restrictions, SIP, account plist extraction, and hash analysis. Password reset changes an account credential; password cracking tests candidates against a hash. They are not the same as decrypting FileVault-protected data, and a reset may not unlock an old keychain. The lecture csrutil disable step changes protection and system state; it is not a neutral evidence-collection step. Modern recovery behavior varies by hardware and macOS version.", "q": "Why is resetting a login password not the same as recovering all encrypted data?", "a": "Encrypted data may require separate original keys or credentials.", "wrong": ["All encrypted data automatically becomes public.", "A login reset always reconstructs deleted files.", "A hash contains every original file."]}, {"id": "t58", "ch": 9, "title": "The journey of an email", "ref": "3–4", "body": "A client submits a message; servers relay it toward the destination; the destination server stores it; the recipient accesses it. Evidence may exist in client databases, server logs, mailboxes, attachments, and backups. Review sender/recipient addresses, copied recipients, timestamps with offsets, message content, attachments, IPs, and application logs. Preserve the original message and full headers; a screenshot alone leaves out useful structure.", "q": "Which evidence should accompany a suspicious message’s visible body?", "a": "Full original headers and relevant message data", "wrong": ["Only the display name", "Only a cropped screenshot", "Only the subject’s first word"]}, {"id": "t59", "ch": 9, "title": "SMTP and its ports", "ref": "5", "body": "SMTP sends mail from clients to servers and between servers. Memorize the lecture’s 25 for SMTP and 465 for implicit TLS SMTP. Additional context: authenticated submission commonly uses 587 with STARTTLS. Port numbers suggest service roles; they do not by themselves prove a connection was encrypted or legitimate. SMTP is transport, not the protocol used to synchronize inbox folders.", "q": "Which protocol relays mail between servers?", "a": "SMTP", "wrong": ["IMAP", "POP3", "FTP"]}, {"id": "t60", "ch": 9, "title": "POP3 versus IMAP", "ref": "5", "body": "POP3 retrieves messages, commonly downloading them; the class model deletes them from the server after download, but clients can be configured to leave copies. IMAP manages mail on the server and synchronizes mailbox state/folders across devices. POP3 ports: 110 and TLS 995. IMAP ports: 143 and TLS 993. Memory cue: SMTP sends; POP pulls; IMAP manages a server mailbox.", "q": "Which secure port is associated with IMAP in the slides?", "a": "993", "wrong": ["995", "465", "110"]}, {"id": "t61", "ch": 9, "title": "Spoofing and anonymous remailing", "ref": "6–8", "body": "Spoofing makes a message appear to come from another sender; a friendly display name or From address is not identity proof. An anonymizing remailer forwards mail after removing or replacing identifying information. Its logs, if available and lawfully obtained, may help trace the prior hop. A malicious email can come from a real compromised account, so even authentic transport does not make a link safe. A visible IP may identify a relay or VPN rather than the sender’s own device.", "q": "What distinguishes an anonymous remailer?", "a": "It forwards mail while replacing or stripping identifying information.", "wrong": ["It proves the visible From name is real.", "It converts all mail to POP3.", "It permanently stores every sender’s legal identity in the subject."]}, {"id": "t62", "ch": 9, "title": "Header standards and required fields", "ref": "9–14", "body": "The course names RFC 2822 for message format: Date and From are required in an ordinary message; Message-ID and In-Reply-To are recommended/conditional context, not the same required pair. RFC 3864 is associated with header-field registration. RFC 3798 describes Message Disposition Notifications (MDNs). These are historical references in the slides; RFC 5322 later superseded RFC 2822. An MDN is a disposition report, not infallible proof that a human read and understood a message.", "q": "Which pair does the course identify as required header fields?", "a": "From and Date", "wrong": ["Subject and Bcc", "Reply-To and References", "Precedence and Content-Type"]}, {"id": "t63", "ch": 9, "title": "Know the header fields", "ref": "11–13", "body": "From identifies the claimed author; Sender can identify a different transmitting agent; Reply-To directs replies; To names primary recipients; Cc names copied recipients; Bcc is generally concealed from other recipients. Subject summarizes the message; Content-Type describes MIME media type/structure; Message-ID identifies a message; In-Reply-To and References connect threads. Do not assume Bcc recipients are all visible in a received copy. A changed Reply-To can be an investigative clue.", "q": "Which field can direct replies somewhere other than the From address?", "a": "Reply-To", "wrong": ["Content-Type", "Date", "Received only"]}, {"id": "t64", "ch": 9, "title": "Received lines and trust", "ref": "10, 13, 32", "body": "Each handling mail server can prepend a Received line, so the newest hop is usually at the top. Read bottom-to-top to reconstruct the apparent chronological route, but verify from known trusted receiving infrastructure toward the origin: attacker-supplied lower lines can be fabricated. Compare IPs, names, timestamps, offsets, and server logs. Header tracing narrows a path; it does not automatically establish a person’s identity or precise physical address.", "q": "Which Received line is usually added most recently?", "a": "The topmost Received line", "wrong": ["The bottommost line in every case", "The Subject line", "The oldest Message-ID"]}, {"id": "t65", "ch": 9, "title": "SPF: permitted sending hosts", "ref": "15–16", "body": "SPF uses a domain’s DNS policy to check whether a connecting mail server is permitted to send for an SMTP envelope identity. It is not a general list of friendly From display names. It authenticates a sending host/domain relationship, not the text’s truth or the human author. Forwarding can complicate SPF checks. Investigators should preserve the receiver’s Authentication-Results and evaluate who produced them.", "q": "What does SPF primarily test?", "a": "Whether the sending host is authorized for the checked envelope domain", "wrong": ["Whether the subject is truthful", "Whether the user read the message", "Whether all attachments are harmless"]}, {"id": "t66", "ch": 9, "title": "DKIM: signed message data", "ref": "16", "body": "DKIM lets a signing domain attach a cryptographic signature over selected headers and body content. A receiver uses the domain’s published key to verify the signature. A valid signature supports integrity of the signed material and association with the signing domain; it does not prove a particular person wrote the email or that its content is safe. SPF and DKIM answer different questions.", "q": "What does successful DKIM verification support?", "a": "Integrity of signed content and association with the signing domain", "wrong": ["A guarantee that the email is not phishing", "Proof that the recipient opened it", "Recovery of deleted attachments"]}, {"id": "t67", "ch": 9, "title": "DMARC: alignment and policy", "ref": "16", "body": "DMARC connects the visible From domain to an aligned passing SPF or DKIM result and supplies domain policy/reporting. A message does not need both mechanisms to pass if one qualifying aligned mechanism passes. Do not confuse authentication with safety: a criminal can authenticate mail for a domain they control, and a compromised legitimate account can send harmful mail. The course’s DNS/SPF/DKIM description is the starting point; alignment is the key distinction.", "q": "Which result can satisfy DMARC authentication alignment?", "a": "A passing aligned SPF or DKIM result", "wrong": ["Any SPF pass for an unrelated domain", "A familiar display name alone", "A Subject containing the company name"]}, {"id": "t68", "ch": 9, "title": "Find the full headers", "ref": "17–25", "body": "Recognize the interfaces shown in the course: classic Outlook → open message → File → Properties → Internet headers; Yahoo → View raw message; Gmail → Show original; the slide’s Hotmail example → View Message Source; Apple Mail → View → Message → Long Headers. These are course/version-specific labels, not a promise every current app looks identical. Export the original when possible and retain attachments in their original relationship to the message.", "q": "Which Gmail option is shown in the lecture for original headers?", "a": "Show original", "wrong": ["Mark unread", "Delete forever", "Add star"]}, {"id": "t69", "ch": 9, "title": "Mail storage formats", "ref": "26–27", "body": "PST is an Outlook data store; OST is an offline/synchronized Outlook store. Outlook Express historically used MBX/DBX, and Eudora used MBX. A common individual-message format is EML; the slide appears to say .emi, which should not be memorized as the usual extension. Database containers and single-message files are different. Keep an original copy before opening a store in a client that might modify it.", "q": "Which extension is associated with an offline Outlook store?", "a": "OST", "wrong": ["PST", "PNG", "ELF"]}, {"id": "t70", "ch": 9, "title": "Paraben and case organization", "ref": "28–31", "body": "The lecture presents Paraben’s Email Examiner as an email-focused forensic application. Its workflow groups evidence by case, associates investigator information, then selects the email database to analyze. FTK and EnCase are broader suites also mentioned for comparison. The important concept is organized, documented examination of original/working evidence, not merely opening a message and reading the body.", "q": "What does the lecture’s Paraben workflow organize evidence around?", "a": "A case and investigator record", "wrong": ["Only the sender’s avatar", "The computer wallpaper", "A Linux runlevel"]}, {"id": "t71", "ch": 9, "title": "Server evidence and retention", "ref": "32–33", "body": "Deletion from a client or both correspondents does not guarantee every server-side copy is gone. Search relevant retained mail, deleted-item retention, logs, backups, or archives within the authorized scope. Retention policies determine what may remain and for how long. Correlate server records with client artifacts and headers. Do not promise recovery: a policy or backup can expire before the investigation.", "q": "Why examine the email server after a user deletes a message?", "a": "Retained copies or logs may still exist.", "wrong": ["Servers are guaranteed to retain all mail forever.", "Deleting a client message creates a new sender.", "Server examination makes headers unnecessary."]}, {"id": "t72", "ch": 9, "title": "Law recognition: privacy and commercial mail", "ref": "34", "body": "For exam recognition: the Fourth Amendment concerns government searches and seizures. ECPA is a framework governing interception and access to electronic communications, including stored communications provisions. CAN-SPAM regulates commercial email practices such as deceptive routing/subjects and opt-out requirements. These names are not blanket permission to inspect anyone’s mailbox. Actual authority depends on the facts, legal process, and scope; this guide provides course-level definitions.", "q": "Which named law primarily concerns commercial email practices?", "a": "CAN-SPAM Act", "wrong": ["The Linux license", "The HFS+ specification", "The FAT standard"]}, {"id": "t73", "ch": 9, "title": "Law recognition: other names in the deck", "ref": "34", "body": "CALEA concerns lawful-interception assistance capabilities of covered communications providers. FISA supplies a framework for certain foreign-intelligence surveillance. The USA PATRIOT Act amended multiple investigative and surveillance authorities; do not assume every original provision is still operative. 18 U.S.C. 2252B addresses misleading Internet domain names used to deceive people into viewing obscenity, with additional provisions involving minors and harmful material. It is not a general anti-spam law.", "q": "Which listed law concerns communications-provider assistance for lawful interception?", "a": "CALEA", "wrong": ["CAN-SPAM alone", "The HFS+ allocation rule", "RFC 3864"]}], "cards": [{"id": "t1", "ch": 5, "title": "Deletion is not erasure", "ref": "3–10", "body": "Think of a file system as a library catalog. Deleting an entry can remove the directions to a book without destroying its pages. A normal deletion generally makes storage reusable; recoverable bytes may remain until overwritten or otherwise erased. Stop unnecessary writes, acquire an image, verify its hash, and recover to a different destination. Recovery is a possibility, not a promise. SSD TRIM and garbage collection can reduce recovery opportunities.", "q": "Why may a normally deleted file still be recoverable?", "a": "Its bytes may remain until its storage is reused.", "wrong": ["Deletion always makes an automatic backup.", "All deleted files are permanently stored in RAM.", "Deletion encrypts the file without removing it."]}, {"id": "t2", "ch": 5, "title": "Sectors, clusters, and slack", "ref": "4–5", "body": "A sector is a storage unit at the device level. A cluster is a file-system allocation unit made of one or more sectors. A small file may occupy only part of its final cluster: the unused tail is file slack. Unallocated space consists of clusters not assigned to active files. An HDD uses magnetic platters and heads; an SSD uses flash chips and a controller. Both can hold evidence, but their deletion behavior differs.", "q": "Unused bytes after a file ends inside its allocated cluster are called what?", "a": "File slack", "wrong": ["Unallocated clusters", "The master boot record", "A hard link"]}, {"id": "t3", "ch": 5, "title": "FAT chains", "ref": "6–8", "body": "FAT16/FAT32 use a file allocation table to track a chain of clusters. Each chain entry points toward the next cluster; EOC marks the end. Other values identify free, reserved, or bad clusters. Deleting a file releases its chain for reuse. If the chain information is lost, fragmentation can make recovery harder even when some content remains. FAT is not limited to old Windows installations; the slides use older Windows to introduce it.", "q": "What does EOC identify in a FAT chain?", "a": "The end of the cluster chain", "wrong": ["An encrypted operating-system cache", "A damaged sector only", "The beginning of every directory"]}, {"id": "t4", "ch": 5, "title": "NTFS: MFT and bitmap", "ref": "9–10", "body": "The Master File Table (MFT) stores records describing files and directories, including names, timestamps, attributes, and data-location information. The volume cluster bitmap tracks allocation. Moving an item to the Recycle Bin is different from permanently deleting it. Technical correction: NTFS deletion clears the record’s in-use state; the slide’s special-character description should not be treated as the general NTFS mechanism. The important exam concept is that deletion need not immediately erase content.", "q": "Which NTFS structure describes individual files and their metadata?", "a": "Master File Table (MFT)", "wrong": ["SPF record", "Linux inode bitmap only", "POP3 mailbox"]}, {"id": "t5", "ch": 5, "title": "Windows recovery tools", "ref": "11–25", "body": "Recognize the tool-to-task matches from the slides: DiskDigger scans for recoverable files; WinUndelete offers a wizard for choosing a drive, file types, and restore destination; FreeUndelete is another recovery utility; OSForensics includes deleted-file searching; Autopsy provides forensic analysis and recovery from images. Product editions, pricing, and exact screens change, so study their roles. Recover onto another disk or working destination to avoid overwriting the evidence you need.", "q": "Which pair includes full forensic tools with deleted-file recovery?", "a": "OSForensics and Autopsy", "wrong": ["PsLoggedOn and netstat", "SPF and DKIM", "GRUB and LILO"]}, {"id": "t6", "ch": 5, "title": "Linux inodes and links", "ref": "26–27", "body": "An inode holds file metadata and references to data; directory entries associate names with inode numbers. Hard links are additional names for the same underlying file. Removing one name decrements the link count. Storage becomes reclaimable after the last hard link is removed and no process still holds the file open. A symbolic or soft link points to a path and does not preserve the target in the same way. The slides simplify deletion to the reference count reaching zero.", "q": "A file has two hard links. One is removed. What normally happens?", "a": "The remaining hard link still accesses the file.", "wrong": ["Both names are automatically erased.", "The inode becomes a Windows MFT record.", "A soft link is automatically created."]}, {"id": "t7", "ch": 5, "title": "Linux recovery with grep and extundelete", "ref": "28–29", "body": "The slides propose reducing writes with legacy single-user mode (init 1), then searching raw data. In grep -i -a -B10 -A100 \"forensics\" image.dd, -i ignores case, -a treats input as text, and -B/-A include lines before/after the match. This extracts matching content, not necessarily a complete original file. extundelete targets ext3/ext4 recovery; the lecture example is extundelete /dev/sda4 --restore-all. Actual recovery depends on filesystem features and remaining metadata. Use copies for practice.", "q": "Which utility in Chapter 5 targets ext3/ext4 undelete?", "a": "extundelete", "wrong": ["ListDLLs", "MacDrive", "PsInfo"]}, {"id": "t8", "ch": 5, "title": "Scalpel and file carving", "ref": "30–32, 44", "body": "File carving recognizes content patterns such as headers and footers rather than relying on a healthy directory entry. Scalpel workflow: install; enable the desired file formats in /etc/scalpel/scalpel.conf; choose an empty output directory; run scalpel against the image with -o for output. Carving is useful when metadata is damaged, but may lose filenames, timestamps, or fragmented pieces. It cannot reconstruct bytes that have actually been overwritten merely by recognizing a header.", "q": "Which recovery method searches file signatures rather than intact directory metadata?", "a": "File carving", "wrong": ["Email remailing", "Registry editing", "Volume formatting"]}, {"id": "t9", "ch": 5, "title": "Signature memory sheet", "ref": "45–46", "body": "Memorize the abbreviated prefixes shown in class: JPEG FF D8; BMP 42 4D; EXE 4D 5A; GIF 47 49; MP3 with ID3 49 44; PDF 25 50; ZIP 50 4B; PNG 89 50; WAV and AVI 52 49. These are short clues, not complete unique validators. WAV and AVI both use RIFF and need later type bytes to distinguish them. Not every MP3 starts with an ID3 tag. A filename extension can be renamed; content signatures give another clue.", "q": "The class prefix 4D 5A most strongly suggests which file type?", "a": "Windows EXE", "wrong": ["JPEG", "PDF", "PNG"]}, {"id": "t10", "ch": 5, "title": "Physical versus logical damage", "ref": "36–39", "body": "Physical damage involves hardware such as a drive controller, read/write head, or platter. Logical damage affects structures such as file-system metadata, even if the hardware still reads. The slides show connecting a drive to a test system, attempting access, imaging, and repair options. For evidence handling, preserve and image before making repairs when feasible; head or platter replacement belongs in a qualified recovery lab. Power failures during writes can leave logical structures inconsistent.", "q": "A healthy drive has corrupted directory structures after a power outage. What kind of damage is this?", "a": "Logical damage", "wrong": ["A broken read/write head", "A cracked platter", "A failed keyboard"]}, {"id": "t11", "ch": 5, "title": "Consistency checking", "ref": "39–42", "body": "Windows chkdsk, Linux fsck, and macOS Disk Utility are associated with file-system checking or repair. The Sleuth Kit and TestDisk also appear in the recovery discussion. A consistency checker compares structures against the filesystem rules; for example, . should refer to the directory itself and .. to its parent. Repairs may discard inconsistent entries, so a repair can change or destroy evidence. Journaling and battery-backed power reduce corruption risk but do not replace backups.", "q": "Why should a forensic examiner avoid immediately repairing the original evidence disk?", "a": "Repair may change or discard evidence.", "wrong": ["Repair always restores every deleted file.", "A checker cannot read directory structures.", "Hashing becomes unnecessary after repair."]}, {"id": "t12", "ch": 5, "title": "Zero-knowledge analysis", "ref": "43", "body": "Here, zero-knowledge analysis means recovery with few assumptions about the damaged file system, not a cryptographic zero-knowledge proof. The tool scans and uses knowledge of valid filesystem structures to reconstruct organization. It is slower than ordinary consistency checking but can help when existing metadata is severely destroyed. Compare: consistency checking trusts enough structure to check it; reconstruction starts with less trust; carving focuses on individual file content.", "q": "Which approach makes few assumptions about surviving filesystem structures?", "a": "Zero-knowledge analysis", "wrong": ["Normal consistency checking only", "SMTP relay", "A Recycle Bin restore only"]}, {"id": "t13", "ch": 5, "title": "macOS recovery overview", "ref": "33–35", "body": "The slides connect macOS recovery to its UNIX heritage and HFS+/APFS storage. They name MacKeeper as a historical recovery example. Do not make a recovery guarantee from a product name: filesystem type, encryption, snapshots, overwriting, and SSD behavior matter. First check Trash and available copies, then consider image-based recovery. A surviving backup can restore content that ordinary undelete cannot.", "q": "What most directly limits recovery of the original deleted bytes?", "a": "Those bytes have been overwritten or erased.", "wrong": ["The filename contains spaces.", "The file was placed in a folder.", "The investigator knows the file type."]}, {"id": "t14", "ch": 6, "title": "Windows versions and boot context", "ref": "3–11", "body": "The slides survey Windows 3.x, 95/NT, 98/2000, XP/Server 2003, Vista/7/Server 2008, 10/Server 2016, Server 2019, 11, Server 2022 and 2025. Establish the examined OS version because paths, artifacts, and boot systems differ. Ask whether the firewall and EFS are enabled. The lecture boot model is legacy: BIOS → POST → MBR/boot loader → NTLDR and boot.ini → kernel, HAL, Registry, subsystem. Modern Windows uses Boot Manager and winload with BIOS or UEFI; do not apply NTLDR to every version.", "q": "Which boot sequence vocabulary belongs to the legacy model in the slides?", "a": "NTLDR and boot.ini", "wrong": ["DKIM and IMAP", "TCC and knowledgeC", "Scalpel and EOC"]}, {"id": "t15", "ch": 6, "title": "Important Windows processes", "ref": "9–11", "body": "Know the roles: ntoskrnl.exe is the Windows kernel; hal.dll provides the hardware abstraction layer; smss.exe manages sessions; winlogon.exe supports interactive logon; lsass.exe handles local security; explorer.exe provides the desktop/file shell; csrss.exe is the client/server runtime subsystem. The slide spells the last item Crss.exe. Legacy ntdetect.com detects hardware; ntbootdd.sys relates to certain older boot configurations. fsutil can report filesystem information. A familiar process name alone does not prove a process is legitimate.", "q": "Which listed file is the Windows kernel?", "a": "ntoskrnl.exe", "wrong": ["explorer.exe", "pagefile.sys", "index.dat"]}, {"id": "t16", "ch": 6, "title": "Collect volatile evidence early", "ref": "12–13", "body": "Volatile evidence includes RAM contents, running processes, active connections, and logged-on users. Power loss can remove it. The chapter workflow is collect a memory dump → compute its hash → analyze in an isolated environment. Document the collection because live acquisition itself changes some state. A hash helps verify that the collected image has not changed; it does not prove that every interpretation of it is correct.", "q": "What is the chapter’s memory-analysis sequence?", "a": "Capture memory, hash the capture, analyze in isolation", "wrong": ["Shut down, clear logs, then capture RAM", "Edit memory first, then trust the filename", "Analyze only the Recycle Bin"]}, {"id": "t17", "ch": 6, "title": "Stack versus heap", "ref": "13", "body": "The stack organizes function-call state with last-in, first-out behavior: the newest call is unwound first. The heap provides dynamically allocated storage that can remain across function calls until released. Both may contain useful values or strings. Neither is a separate permanent archive. Memory evidence must be interpreted in process context rather than assuming every string was intentionally saved.", "q": "Which memory organization is associated with last-in, first-out behavior?", "a": "Stack", "wrong": ["Heap", "Volume Shadow Copy", "MFT"]}, {"id": "t18", "ch": 6, "title": "Match live-response tools", "ref": "14–19", "body": "PsList lists process information. PsInfo reports system/OS information. ListDLLs reports loaded DLLs. PsLoggedOn reports logon information. netstat reports network connections and listening endpoints. Example: investigate a suspicious network connection by combining netstat results with process information instead of treating the IP address alone as proof of malware.", "q": "Which tool is the direct match for loaded dynamic-link libraries?", "a": "ListDLLs", "wrong": ["PsInfo", "PsLoggedOn", "netstat"]}, {"id": "t19", "ch": 6, "title": "Paging versus hibernation", "ref": "20–21", "body": "pagefile.sys is disk-backed paging space that supports virtual memory and can retain memory fragments. hiberfil.sys stores hibernation-related memory state and can contain application artifacts. Depending on format and tool support, an examiner may convert and analyze a hibernation file or search strings. Neither is identical to a fresh live RAM capture. The files are commonly at the system drive root, not necessarily inside the Windows folder.", "q": "Which file is associated with hibernation rather than ordinary paging?", "a": "hiberfil.sys", "wrong": ["pagefile.sys", "boot.ini", "index.dat"]}, {"id": "t20", "ch": 6, "title": "Volume Shadow Copy", "ref": "22", "body": "Volume Shadow Copy Service (VSS) supports point-in-time volume snapshots. Older versions of changed data can help reconstruct or recover prior file states. The slide describes daily changed-block copying; snapshot frequency actually depends on configuration and the requester. A snapshot is different from RAM, a pagefile, or a deleted-file list. Investigate whether snapshots exist instead of assuming they are always available.", "q": "Where might an examiner find a previous state of a file?", "a": "A volume shadow copy", "wrong": ["Only the active TCP connection list", "An SPF record", "The CPU instruction register only"]}, {"id": "t21", "ch": 6, "title": "Windows event logs", "ref": "23–24", "body": "Event Viewer displays logs. Security relates to audited security events; Application to application events; System to OS/components; ForwardedEvents to collected remote events; Applications and Services to more specific providers. For a timeline, correlate relevant entries with user, process, and file evidence. Logging configuration and retention affect what exists. Absence of a log entry is not automatically absence of activity.", "q": "Which Windows interface is used to inspect event logs?", "a": "Event Viewer", "wrong": ["Scalpel", "GRUB", "DiskDigger only"]}, {"id": "t22", "ch": 6, "title": "User folders and program folders", "ref": "25", "body": "C:\\Users contains profiles for multiple users; C:\\Users\\username\\Documents holds one user’s documents. C:\\Program Files normally holds applications, and on 64-bit Windows C:\\Program Files (x86) conventionally holds 32-bit applications. Older Windows used Documents and Settings. Examine all relevant profiles, not just the currently logged-on user. The slide’s combined Windows documents and settings path is not a universal directory.", "q": "On 64-bit Windows, which directory conventionally holds 32-bit applications?", "a": "C:\\Program Files (x86)", "wrong": ["C:\\Users\\Public only", "C:\\Windows\\Logs only", "C:\\$MFT"]}, {"id": "t23", "ch": 6, "title": "Unallocated space, slack, and ADS", "ref": "26", "body": "Unallocated space is available for new allocation; slack is unused space within an allocated file’s last cluster. Both may hold remnants. NTFS alternate data streams (ADS) are additional named streams associated with a file and may store data separate from its default stream. ADS are not the same as deleted data. FTK indexing makes keyword searching across an image more efficient; a keyword match still needs context and validation.", "q": "An extra named stream attached to an NTFS file is what?", "a": "An alternate data stream", "wrong": ["A Linux runlevel", "An email Received field", "A volume partition table"]}, {"id": "t24", "ch": 6, "title": "Legacy browser artifact: index.dat", "ref": "27–28", "body": "index.dat belongs to legacy Internet Explorer activity, not Microsoft Edge. The slides associate it with browsing addresses, searches, and recently accessed items and name Window Washer as a viewing example. Identify the browser and version before selecting artifact locations. Finding a historical URL is evidence of recorded activity, not by itself proof that a particular person intentionally viewed the page.", "q": "Which browser family is associated with the chapter’s index.dat discussion?", "a": "Legacy Internet Explorer", "wrong": ["Microsoft Edge exclusively", "Safari exclusively", "Every browser without exception"]}, {"id": "t25", "ch": 6, "title": "Copy/move permissions and MAC times", "ref": "29–30", "body": "The lecture rule for the same NTFS volume: a normal copy inherits destination permissions; a normal move retains existing permissions. MAC in this context means Modified, Accessed, Created—not a network MAC address. Created refers to creation on that volume; Modified to content change; Accessed to access activity. Tools, OS settings, copying, and timestamp manipulation can complicate a timeline. Do not interpret a timestamp without context.", "q": "Under the chapter’s same-volume rule, a normally moved file does what?", "a": "Retains its existing permissions", "wrong": ["Always removes all permissions", "Always inherits destination permissions as a new copy", "Converts its permissions to SPF"]}, {"id": "t26", "ch": 6, "title": "Registry root keys", "ref": "31–35", "body": "The Registry stores configuration for the system, users, hardware, and programs. HKLM = machine-wide settings; HKCU = current user; HKU = loaded users; HKCR = classes/file associations; HKCC = current hardware configuration. The slides abbreviate HKEY_CURRENT_CONFIG as HCU; HKCC is the usual abbreviation. Registry evidence can point to USB use, wireless connections, application settings, recent activity, and removed software.", "q": "Which Registry root is most directly associated with machine-wide configuration?", "a": "HKEY_LOCAL_MACHINE", "wrong": ["HKEY_CURRENT_USER", "HKEY_CLASSES_ROOT only", "HKEY_CURRENT_CONFIG only"]}, {"id": "t27", "ch": 6, "title": "Control sets", "ref": "33–34", "body": "The slides present ControlSet001 as the booted set and ControlSet002 as last known good, CurrentControlSet as a reference to the active set, and Clone as a boot-time copy. Treat the numbering as a lecture example, not a fixed mapping on every Windows installation. The key exam idea is that CurrentControlSet selects active control configuration; different stored sets can support startup and recovery.", "q": "What is CurrentControlSet conceptually?", "a": "A reference to the active control set", "wrong": ["The folder containing every user document", "A copy of the email server", "The FAT end-of-chain marker"]}, {"id": "t28", "ch": 6, "title": "Application activity artifacts", "ref": "36–43", "body": "Use several artifacts together. UserAssist can record GUI-launched application activity. Prefetch can support application execution analysis and may include run information. Shimcache/AppCompatCache holds compatibility-related program metadata; its presence alone is not universal proof of execution. Amcache stores program/file inventory metadata. ShellBags preserve folder-view information and can help identify folders browsed. SRUM concerns resource usage. BAM/DAM relate to background/desktop activity management. Availability and meanings vary by Windows version.", "q": "Which artifact is especially associated with folder browsing/view settings?", "a": "ShellBags", "wrong": ["SPF", "Volume boot blocks", "POP3"]}, {"id": "t29", "ch": 6, "title": "A Windows investigation in plain language", "ref": "12–43", "body": "Suppose a user denies running a program and copying files. Preserve live memory and connections if appropriate; image the disk; inspect all relevant user profiles; correlate application artifacts, USB-related Registry data, file timestamps, and event logs. A single artifact can be ambiguous. A stronger conclusion connects multiple independent records with compatible timestamps and documented acquisition. Separate observed facts from inferred actions.", "q": "Why correlate several Windows artifacts?", "a": "One artifact may be incomplete or ambiguous.", "wrong": ["Multiple artifacts eliminate the need to preserve originals.", "Every artifact records exactly the same events.", "File names alone conclusively identify the user."]}, {"id": "t30", "ch": 7, "title": "Linux foundations, shells, and desktops", "ref": "3–4, 11–14, 18", "body": "Linux is a kernel used in distributions such as Ubuntu, Debian, Fedora, Mint, RHEL, openSUSE, and CentOS. The lecture timeline connects UNIX, GNU, Minix, and Linux (1991). A shell interprets commands: Bash, sh, ksh, and csh are examples. A graphical desktop is a different layer: GNOME, KDE Plasma, CDE, Enlightenment, Cinnamon, and LXDE. Cinnamon is associated with Mint; LXDE emphasizes low resource use. Do not confuse a distribution, a shell, and a desktop.", "q": "Which item is a shell rather than a distribution or desktop?", "a": "Bash", "wrong": ["Ubuntu", "GNOME", "KDE Plasma"]}, {"id": "t31", "ch": 7, "title": "Navigation and directory listing", "ref": "5–6", "body": "ls lists entries; ls -l gives a long listing; ls -a includes hidden dot-names. cd changes directory: cd .. moves to the parent, cd / to the filesystem root, and cd ~ to your home. mkdir creates a directory; mkdir -p also creates missing parents. Correction: ls -ls means long listing plus allocated-size information; use ls -lS to sort by size. Case matters in command flags.", "q": "Which command includes hidden dot-files in a directory listing?", "a": "ls -a", "wrong": ["cd ..", "mkdir -p", "ls -S alone"]}, {"id": "t32", "ch": 7, "title": "Copying, moving, and deleting", "ref": "5–7", "body": "cp copies; cp -R recursively copies directory contents. mv moves or renames. rm removes file names; rm -i prompts; rm -r operates recursively. rmdir removes empty directories, not arbitrary populated directories. These change data, so recognize them on an exam but practice on disposable files or copies. A command’s name does not make it a forensic acquisition tool.", "q": "Whi
