ch command removes an empty directory?", "a": "rmdir", "wrong": ["mkdir", "pwd", "lsof"]}, {"id": "t33", "ch": 7, "title": "Processes: ps, pstree, top, pgrep", "ref": "8–9, 35–37", "body": "ps provides a process snapshot; ps aux is a common broad listing. pstree shows parent-child relationships. top refreshes process/resource information interactively. pgrep locates process IDs by matching criteria. The slides simplify some ps flags; options differ between styles, so ps -a alone is not literally every process. If a shell unexpectedly launches an executable, the process tree helps connect them.", "q": "Which tool most directly shows which process launched another process?", "a": "pstree", "wrong": ["fsck", "lsattr", "fdisk"]}, {"id": "t34", "ch": 7, "title": "Open files, attributes, partitions, mounts", "ref": "9–10", "body": "lsof lists open files and the processes using them. lsattr lists filesystem attributes where supported. fdisk -l lists partition information; note the space before -l. mount attaches a filesystem at a mount point; the chapter example mounts a floppy at /mnt/floppy. fsck checks filesystem consistency and may modify structures depending on invocation. A mounted drive is not automatically read-only.", "q": "Which tool links open files to processes?", "a": "lsof", "wrong": ["lsattr", "fdisk -l", "mkdir"]}, {"id": "t35", "ch": 7, "title": "Legacy boot sequence", "ref": "15–16, 27", "body": "Study the class sequence: BIOS/POST → MBR → GRUB or LILO → kernel initialization → init → runlevel. The kernel manages hardware and core OS functions; the boot loader loads the kernel. /etc/inittab is part of the legacy init configuration. Modern distributions commonly use UEFI and systemd, so this is a course model rather than a universal boot recipe.", "q": "In the lecture Linux boot sequence, what loads before the kernel?", "a": "GRUB or LILO", "wrong": ["The email inbox", "A Windows UserAssist key", "The final graphical login only"]}, {"id": "t36", "ch": 7, "title": "Runlevels: memorize 0, 1, 3, 5, 6", "ref": "16", "body": "The slide’s traditional mapping is 0 halt, 1 single-user, 2 user-definable, 3 multiuser without GUI, 4 user-definable, 5 multiuser with GUI, 6 reboot. Its service directories follow /etc/rc.d/rcN.d. Memory cue: 0 stops, 1 is alone, 3 is text, 5 adds graphics, 6 restarts. These mappings vary by distribution; answer course-specific questions using the table.", "q": "According to the slide table, which runlevel is multiuser without a GUI?", "a": "3", "wrong": ["1", "5", "6"]}, {"id": "t37", "ch": 7, "title": "LVM and snapshots", "ref": "17", "body": "Logical Volume Management adds an abstraction between physical storage and logical volumes. The chapter emphasizes resizing storage and taking snapshots for backups. A snapshot captures a point-in-time view; it is not inherently an independent off-device backup. Forensics requires knowing which logical volumes and underlying physical devices hold the relevant data.", "q": "Which pair describes the chapter’s main LVM benefits?", "a": "Resizing volumes and taking snapshots", "wrong": ["Sending email and validating DKIM", "Launching GNOME and changing passwords", "Deleting logs and hiding partitions"]}, {"id": "t38", "ch": 7, "title": "ext3/ext4 journaling modes", "ref": "19", "body": "Journaling records pending changes to help recover consistency after a crash. In journal mode, file data and metadata are journaled; ordered mode journals metadata and orders data writes before related metadata commit; writeback mode journals metadata without that same ordering guarantee. The slide ranks journal as safest for this purpose and writeback as least safe. It lists ext4 limits of 1 EB volumes and 16 TB files; actual limits depend on features and configuration.", "q": "Which mode journals both file data and metadata?", "a": "Journal mode", "wrong": ["Ordered mode", "Writeback mode", "No-journal mode"]}, {"id": "t39", "ch": 7, "title": "Other file systems", "ref": "20", "body": "The slides describe ReiserFS as journaled and efficient with many small files. Berkeley Fast File System is associated with UFS and a bitmap for free-space tracking. Technical context: FFS/UFS comes from BSD/UNIX history, not originally from Linux. The central comparison is how a filesystem organizes data, tracks free storage, and supports recovery after interrupted writes.", "q": "Which filesystem does the lecture associate with many small files?", "a": "ReiserFS", "wrong": ["NTFS ADS", "APFS only", "FAT EOC"]}, {"id": "t40", "ch": 7, "title": "Linux log locations", "ref": "21–22", "body": "Learn the lecture matches: kern.log → kernel messages; lpr.log → printing; mail.* → email; mysql.* → database; apache2/* and lighttpd/* → web servers; apport.log → crashes; IDS logs → suspicious traffic. The slide lists fail.log for failed logins; actual systems may use auth.log, secure, btmp, faillog, or the system journal. Confirm the distribution and logging configuration rather than expecting every example path.", "q": "Which lecture log best matches kernel messages?", "a": "/var/log/kern.log", "wrong": ["/var/log/mail.*", "/var/log/apache2/*", "/var/log/lpr.log"]}, {"id": "t41", "ch": 7, "title": "Reading and investigating logs", "ref": "22, 35–36", "body": "less and more page through text. tail -f follows new lines as a file grows. grep searches matching content. dmesg displays the kernel ring buffer; dmesg | lpr sends that output to the print system. ls -al gives sizes that can reveal zero-byte logs, but a listing alone does not prove deliberate deletion. An unexplained gap, truncation, or binary content deserves comparison with rotated logs and other sources.", "q": "Which command follows new log lines live?", "a": "tail -f logfile", "wrong": ["mkdir logfile", "rm logfile", "cd logfile"]}, {"id": "t42", "ch": 7, "title": "Root, home, binaries, and configuration", "ref": "24–26, 30", "body": "/ is the filesystem root. /root is the root administrator’s home; /home commonly holds ordinary users’ homes. /bin contains essential command binaries; /sbin holds system-administration binaries. /etc stores system configuration. /usr holds shareable software and related data, not the normal collection of personal home directories. The slide’s /usr description needs that correction. Evidence in /etc may reveal altered services or startup configuration.", "q": "Where would you usually look for system configuration files?", "a": "/etc", "wrong": ["/dev", "/proc only", "/mnt only"]}, {"id": "t43", "ch": 7, "title": "Devices, boot files, and mount points", "ref": "28–29", "body": "/dev contains device nodes, such as disk interfaces. /boot contains boot-related files, often kernel images and boot-loader data. /mnt is a conventional temporary mount location; other mount locations exist, so it is not a complete inventory of mounted devices. The slides use older hd/fd naming examples; actual devices can appear as /dev/sda or /dev/nvme0n1 and partitions under those names.", "q": "Which directory contains device nodes?", "a": "/dev", "wrong": ["/root", "/usr/share", "/var/backups"]}, {"id": "t44", "ch": 7, "title": "Temporary files, backups, and spools", "ref": "30–31", "body": "/tmp holds temporary files and can be cleared at boot or by policy. /var/tmp is intended for temporary files surviving reboots; the slide’s 30-day cleanup is an example policy, not a universal guarantee. /var/backups may hold copies of system files. /var/spool contains queued work such as printing or mail. Collect transient data promptly and document actual retention settings.", "q": "Which directory is intended for temporary data that survives reboots?", "a": "/var/tmp", "wrong": ["/proc", "/dev", "/boot"]}, {"id": "t45", "ch": 7, "title": "proc, run, and tmpfs", "ref": "32–34", "body": "/proc exposes kernel/process state through a virtual filesystem. /run holds runtime state, commonly on volatile storage. tmpfs is memory-backed and its filesystem contents disappear when unmounted; collect relevant data before shutdown. Correction: Linux tmpfs can use swap, so “never written to disk” is too absolute. The lecture Volatility command is a version-specific analysis example, not a universal memory-capture command.", "q": "Why prioritize collecting relevant tmpfs content?", "a": "Its filesystem contents disappear on unmount or shutdown.", "wrong": ["It is always a permanent backup.", "It is an email archive format.", "It cannot contain user data."]}, {"id": "t46", "ch": 7, "title": "Identify files and search suspicious content", "ref": "35, 38–40", "body": "file examines content to identify type; an extension can lie. ELF is the common Linux executable format. The lecture combines find with file and grep ELF to locate executables, including in /tmp. find / -mtime -1 finds files modified within roughly the last 24 hours; it does not specifically mean newly created. find / -type d -name \".*\" locates dot-prefixed directories. -nouser/-nogroup can identify orphaned ownership references.", "q": "What does find / -mtime -1 primarily filter on?", "a": "Modification time within the last day", "wrong": ["Creation time only", "The owner’s last login", "File size greater than one MB"]}, {"id": "t47", "ch": 7, "title": "Scheduled tasks and user context", "ref": "35, 39–40", "body": "Check scheduled work for unexplained persistence. The run-together slide line should be read as three commands: crontab -l lists the current user’s cron jobs; atq lists queued at jobs; systemctl list-timers --all lists systemd timers. history can show shell command history, but may be incomplete. who shows logged-on users; su switches user context; kill sends a signal to a process. These are distinct tasks.", "q": "Which command lists systemd timers?", "a": "systemctl list-timers --all", "wrong": ["crontab -r", "lsattr /tmp", "file /etc/passwd"]}, {"id": "t48", "ch": 7, "title": "Linux recovery and forensic workflow", "ref": "41–49", "body": "The lecture’s manual recovery reduces activity using single-user mode, searches raw storage with grep, and examines recovered text. Prefer working from an acquired image with verified hashes. Kali includes tools useful for an independent second examination. The slides show legacy web-based Autopsy, a GUI for The Sleuth Kit: create a case, add a host, add an image, verify its hash, then analyze. A mounted image and a booted VM are different; a running guest may write, so preserve the original and use a working copy/overlay.", "q": "Why verify the forensic image’s hash?", "a": "To detect changes to the acquired image", "wrong": ["To automatically decrypt every file", "To prove who typed every command", "To convert Linux to Windows"]}, {"id": "t49", "ch": 7, "title": "Document the system and recognize advanced tools", "ref": "50", "body": "cat /etc/os-release identifies OS information; cat /etc/hostname reports the stored hostname; cat /etc/timezone may report timezone where that file exists. The slide also names older Sleuth Kit dcat, dls, dcalc, dstat and mmls: recognize data-unit inspection, listing, address translation, statistics, and volume-layout work. locate searches a filename database, which may be stale; xargs builds command arguments from input. Keep timezone context when joining evidence from different machines.", "q": "Which command reads the distribution identification file?", "a": "cat /etc/os-release", "wrong": ["cat /etc/hostname", "cat /etc/timezone", "pstree"]}, {"id": "t50", "ch": 8, "title": "Mac foundations and file systems", "ref": "3–11", "body": "The chapter surveys Apple history, OS X releases, and macOS through Tahoe. Core filesystem progression: MFS → HFS → HFS+ → APFS. HFS+ adds Unicode, long names, journaling, quotas, links, and aliases. APFS arrived with the High Sierra era and is distinct from HFS+. The slides list support for other filesystem formats such as ISO9660, MS-DOS/FAT, NTFS, UDF, and UFS; support and write capability depend on OS and drivers. Partition schemes include MBR, GPT, and Apple Partition Map.", "q": "Which is Apple’s newer filesystem contrasted with HFS+?", "a": "APFS", "wrong": ["ext3", "ReiserFS", "FAT16 only"]}, {"id": "t51", "ch": 8, "title": "HFS+ structures", "ref": "7–9", "body": "For the HFS+ model in class, sectors 0 and 1 are boot blocks and sector 2 contains the volume header. The allocation file tracks which allocation blocks are in use/free. HFS+ uses 32-bit allocation block addressing, names up to 255 characters, Unicode, hard/soft links, aliases, quotas, and journaling. An alias is a reference to an item, not another independent copy of its contents.", "q": "In the chapter’s HFS+ layout, what is in sector 2?", "a": "The volume header", "wrong": ["The SMTP queue", "The Windows Registry", "The Linux kernel ring buffer"]}, {"id": "t52", "ch": 8, "title": "Boot Camp and acquisition", "ref": "12, 20–22, 26, 29–32", "body": "Boot Camp can place Windows alongside macOS on supported Intel Macs; an examination may need both OS environments. The slides name MacQuisition for imaging and MacDrive/APFS for Windows for reading Apple filesystems from a Windows workstation. Target Disk Mode exposes a supported Mac’s storage to another Mac. Correction: it is not inherently a write blocker. Use a validated acquisition method and protect the source. Preserve a master image and analyze a copy; simply starting a VM does not guarantee immutability.", "q": "Why does Boot Camp matter to an examiner?", "a": "Relevant evidence may also exist in the installed Windows environment.", "wrong": ["It proves all files were deleted.", "It removes the need to image the drive.", "It means the computer cannot use macOS."]}, {"id": "t53", "ch": 8, "title": "Mac logs and useful paths", "ref": "13–19, 23", "body": "Map evidence to locations: /Users → user accounts/files; /Applications → installed apps; /Volumes → mounted volumes; /etc → configuration; /private/var/audit → audit records; /var/spool/cups → print spool information; /var/vm → swap/sleep-related evidence depending on version. User Library/Preferences can retain app settings, including traces after removal. Shell history depends on the shell, such as .bash_history or .zsh_history. Some slide paths contain typos or old examples; validate paths on the actual image.", "q": "Where should you look for mounted-volume entries on macOS?", "a": "/Volumes", "wrong": ["/Applications", "/System/SMTP", "/Windows"]}, {"id": "t54", "ch": 8, "title": "TCC and knowledgeC", "ref": "27–28", "body": "TCC means Transparency, Consent, and Control. Its database records privacy permission decisions for applications; the slides show system and user TCC.db locations under Library/Application Support/com.apple.TCC. knowledgeC.db is associated with the Knowledge framework and can record activity context; the chapter points to ~/Library/Application Support/Knowledge/. Availability varies by version. These artifacts help answer what apps were allowed to access and what activity context was recorded, not automatically who physically used the device.", "q": "Which database records application privacy-permission decisions?", "a": "TCC.db", "wrong": ["The FAT table", "index.dat", "The SPF zone"]}, {"id": "t55", "ch": 8, "title": "Mac shell commands", "ref": "24–25", "body": "date reports date/time context. ls /dev/disk? lists matching device names. system_profiler SPHardwareDataType reports hardware information; system_profiler SPSoftwareDataType reports software/system information. The slide line breaks split those DataType names; type each as one argument. The deck’s hdiutil partition example should be treated as a version-specific slide example; diskutil list is a common way to inspect disk/partition layout. Shell familiarity transfers from Linux, but paths and options can differ.", "q": "Which command requests Mac hardware information?", "a": "system_profiler SPHardwareDataType", "wrong": ["system_profiler SPSoftwareDataType", "tail -f /var/log/mail", "PsLoggedOn"]}, {"id": "t56", "ch": 8, "title": "Trash and undelete limits", "ref": "33–37", "body": "Start with the user’s Trash, commonly ~/.Trash; external volumes can have their own trash storage. Moving a file back out of Trash differs from recovering a file after permanent deletion. The slides name Disk Drill, Mac Undelete, and Free Undelete as recovery examples. Truly overwritten bytes are not recovered by ordinary undelete; seek surviving copies, snapshots, or fragments elsewhere. APFS, encryption, and SSD TRIM complicate recovery.", "q": "If a file is still in Trash, what is the simplest recovery concept?", "a": "Restore the existing item from Trash", "wrong": ["Reconstruct overwritten bytes by guessing", "Replace the disk platters immediately", "Disable every security feature first"]}, {"id": "t57", "ch": 8, "title": "Password recovery: understand the distinctions", "ref": "38–44", "body": "The slides cover authorized recovery: older Intel Command-R recovery, resetpassword, firmware-password restrictions, SIP, account plist extraction, and hash analysis. Password reset changes an account credential; password cracking tests candidates against a hash. They are not the same as decrypting FileVault-protected data, and a reset may not unlock an old keychain. The lecture csrutil disable step changes protection and system state; it is not a neutral evidence-collection step. Modern recovery behavior varies by hardware and macOS version.", "q": "Why is resetting a login password not the same as recovering all encrypted data?", "a": "Encrypted data may require separate original keys or credentials.", "wrong": ["All encrypted data automatically becomes public.", "A login reset always reconstructs deleted files.", "A hash contains every original file."]}, {"id": "t58", "ch": 9, "title": "The journey of an email", "ref": "3–4", "body": "A client submits a message; servers relay it toward the destination; the destination server stores it; the recipient accesses it. Evidence may exist in client databases, server logs, mailboxes, attachments, and backups. Review sender/recipient addresses, copied recipients, timestamps with offsets, message content, attachments, IPs, and application logs. Preserve the original message and full headers; a screenshot alone leaves out useful structure.", "q": "Which evidence should accompany a suspicious message’s visible body?", "a": "Full original headers and relevant message data", "wrong": ["Only the display name", "Only a cropped screenshot", "Only the subject’s first word"]}, {"id": "t59", "ch": 9, "title": "SMTP and its ports", "ref": "5", "body": "SMTP sends mail from clients to servers and between servers. Memorize the lecture’s 25 for SMTP and 465 for implicit TLS SMTP. Additional context: authenticated submission commonly uses 587 with STARTTLS. Port numbers suggest service roles; they do not by themselves prove a connection was encrypted or legitimate. SMTP is transport, not the protocol used to synchronize inbox folders.", "q": "Which protocol relays mail between servers?", "a": "SMTP", "wrong": ["IMAP", "POP3", "FTP"]}, {"id": "t60", "ch": 9, "title": "POP3 versus IMAP", "ref": "5", "body": "POP3 retrieves messages, commonly downloading them; the class model deletes them from the server after download, but clients can be configured to leave copies. IMAP manages mail on the server and synchronizes mailbox state/folders across devices. POP3 ports: 110 and TLS 995. IMAP ports: 143 and TLS 993. Memory cue: SMTP sends; POP pulls; IMAP manages a server mailbox.", "q": "Which secure port is associated with IMAP in the slides?", "a": "993", "wrong": ["995", "465", "110"]}, {"id": "t61", "ch": 9, "title": "Spoofing and anonymous remailing", "ref": "6–8", "body": "Spoofing makes a message appear to come from another sender; a friendly display name or From address is not identity proof. An anonymizing remailer forwards mail after removing or replacing identifying information. Its logs, if available and lawfully obtained, may help trace the prior hop. A malicious email can come from a real compromised account, so even authentic transport does not make a link safe. A visible IP may identify a relay or VPN rather than the sender’s own device.", "q": "What distinguishes an anonymous remailer?", "a": "It forwards mail while replacing or stripping identifying information.", "wrong": ["It proves the visible From name is real.", "It converts all mail to POP3.", "It permanently stores every sender’s legal identity in the subject."]}, {"id": "t62", "ch": 9, "title": "Header standards and required fields", "ref": "9–14", "body": "The course names RFC 2822 for message format: Date and From are required in an ordinary message; Message-ID and In-Reply-To are recommended/conditional context, not the same required pair. RFC 3864 is associated with header-field registration. RFC 3798 describes Message Disposition Notifications (MDNs). These are historical references in the slides; RFC 5322 later superseded RFC 2822. An MDN is a disposition report, not infallible proof that a human read and understood a message.", "q": "Which pair does the course identify as required header fields?", "a": "From and Date", "wrong": ["Subject and Bcc", "Reply-To and References", "Precedence and Content-Type"]}, {"id": "t63", "ch": 9, "title": "Know the header fields", "ref": "11–13", "body": "From identifies the claimed author; Sender can identify a different transmitting agent; Reply-To directs replies; To names primary recipients; Cc names copied recipients; Bcc is generally concealed from other recipients. Subject summarizes the message; Content-Type describes MIME media type/structure; Message-ID identifies a message; In-Reply-To and References connect threads. Do not assume Bcc recipients are all visible in a received copy. A changed Reply-To can be an investigative clue.", "q": "Which field can direct replies somewhere other than the From address?", "a": "Reply-To", "wrong": ["Content-Type", "Date", "Received only"]}, {"id": "t64", "ch": 9, "title": "Received lines and trust", "ref": "10, 13, 32", "body": "Each handling mail server can prepend a Received line, so the newest hop is usually at the top. Read bottom-to-top to reconstruct the apparent chronological route, but verify from known trusted receiving infrastructure toward the origin: attacker-supplied lower lines can be fabricated. Compare IPs, names, timestamps, offsets, and server logs. Header tracing narrows a path; it does not automatically establish a person’s identity or precise physical address.", "q": "Which Received line is usually added most recently?", "a": "The topmost Received line", "wrong": ["The bottommost line in every case", "The Subject line", "The oldest Message-ID"]}, {"id": "t65", "ch": 9, "title": "SPF: permitted sending hosts", "ref": "15–16", "body": "SPF uses a domain’s DNS policy to check whether a connecting mail server is permitted to send for an SMTP envelope identity. It is not a general list of friendly From display names. It authenticates a sending host/domain relationship, not the text’s truth or the human author. Forwarding can complicate SPF checks. Investigators should preserve the receiver’s Authentication-Results and evaluate who produced them.", "q": "What does SPF primarily test?", "a": "Whether the sending host is authorized for the checked envelope domain", "wrong": ["Whether the subject is truthful", "Whether the user read the message", "Whether all attachments are harmless"]}, {"id": "t66", "ch": 9, "title": "DKIM: signed message data", "ref": "16", "body": "DKIM lets a signing domain attach a cryptographic signature over selected headers and body content. A receiver uses the domain’s published key to verify the signature. A valid signature supports integrity of the signed material and association with the signing domain; it does not prove a particular person wrote the email or that its content is safe. SPF and DKIM answer different questions.", "q": "What does successful DKIM verification support?", "a": "Integrity of signed content and association with the signing domain", "wrong": ["A guarantee that the email is not phishing", "Proof that the recipient opened it", "Recovery of deleted attachments"]}, {"id": "t67", "ch": 9, "title": "DMARC: alignment and policy", "ref": "16", "body": "DMARC connects the visible From domain to an aligned passing SPF or DKIM result and supplies domain policy/reporting. A message does not need both mechanisms to pass if one qualifying aligned mechanism passes. Do not confuse authentication with safety: a criminal can authenticate mail for a domain they control, and a compromised legitimate account can send harmful mail. The course’s DNS/SPF/DKIM description is the starting point; alignment is the key distinction.", "q": "Which result can satisfy DMARC authentication alignment?", "a": "A passing aligned SPF or DKIM result", "wrong": ["Any SPF pass for an unrelated domain", "A familiar display name alone", "A Subject containing the company name"]}, {"id": "t68", "ch": 9, "title": "Find the full headers", "ref": "17–25", "body": "Recognize the interfaces shown in the course: classic Outlook → open message → File → Properties → Internet headers; Yahoo → View raw message; Gmail → Show original; the slide’s Hotmail example → View Message Source; Apple Mail → View → Message → Long Headers. These are course/version-specific labels, not a promise every current app looks identical. Export the original when possible and retain attachments in their original relationship to the message.", "q": "Which Gmail option is shown in the lecture for original headers?", "a": "Show original", "wrong": ["Mark unread", "Delete forever", "Add star"]}, {"id": "t69", "ch": 9, "title": "Mail storage formats", "ref": "26–27", "body": "PST is an Outlook data store; OST is an offline/synchronized Outlook store. Outlook Express historically used MBX/DBX, and Eudora used MBX. A common individual-message format is EML; the slide appears to say .emi, which should not be memorized as the usual extension. Database containers and single-message files are different. Keep an original copy before opening a store in a client that might modify it.", "q": "Which extension is associated with an offline Outlook store?", "a": "OST", "wrong": ["PST", "PNG", "ELF"]}, {"id": "t70", "ch": 9, "title": "Paraben and case organization", "ref": "28–31", "body": "The lecture presents Paraben’s Email Examiner as an email-focused forensic application. Its workflow groups evidence by case, associates investigator information, then selects the email database to analyze. FTK and EnCase are broader suites also mentioned for comparison. The important concept is organized, documented examination of original/working evidence, not merely opening a message and reading the body.", "q": "What does the lecture’s Paraben workflow organize evidence around?", "a": "A case and investigator record", "wrong": ["Only the sender’s avatar", "The computer wallpaper", "A Linux runlevel"]}, {"id": "t71", "ch": 9, "title": "Server evidence and retention", "ref": "32–33", "body": "Deletion from a client or both correspondents does not guarantee every server-side copy is gone. Search relevant retained mail, deleted-item retention, logs, backups, or archives within the authorized scope. Retention policies determine what may remain and for how long. Correlate server records with client artifacts and headers. Do not promise recovery: a policy or backup can expire before the investigation.", "q": "Why examine the email server after a user deletes a message?", "a": "Retained copies or logs may still exist.", "wrong": ["Servers are guaranteed to retain all mail forever.", "Deleting a client message creates a new sender.", "Server examination makes headers unnecessary."]}, {"id": "t72", "ch": 9, "title": "Law recognition: privacy and commercial mail", "ref": "34", "body": "For exam recognition: the Fourth Amendment concerns government searches and seizures. ECPA is a framework governing interception and access to electronic communications, including stored communications provisions. CAN-SPAM regulates commercial email practices such as deceptive routing/subjects and opt-out requirements. These names are not blanket permission to inspect anyone’s mailbox. Actual authority depends on the facts, legal process, and scope; this guide provides course-level definitions.", "q": "Which named law primarily concerns commercial email practices?", "a": "CAN-SPAM Act", "wrong": ["The Linux license", "The HFS+ specification", "The FAT standard"]}, {"id": "t73", "ch": 9, "title": "Law recognition: other names in the deck", "ref": "34", "body": "CALEA concerns lawful-interception assistance capabilities of covered communications providers. FISA supplies a framework for certain foreign-intelligence surveillance. The USA PATRIOT Act amended multiple investigative and surveillance authorities; do not assume every original provision is still operative. 18 U.S.C. 2252B addresses misleading Internet domain names used to deceive people into viewing obscenity, with additional provisions involving minors and harmful material. It is not a general anti-spam law.", "q": "Which listed law concerns communications-provider assistance for lawful interception?", "a": "CALEA", "wrong": ["CAN-SPAM alone", "The HFS+ allocation rule", "RFC 3864"]}, {"id": "e1", "ch": 5, "q": "Which signature prefix suggests JPEG?", "a": "FF D8", "wrong": ["25 50", "4D 5A", "89 50"], "ref": "Chapter review", "body": "FF D8"}, {"id": "e2", "ch": 5, "q": "Which signature prefix suggests PDF?", "a": "25 50", "wrong": ["FF D8", "42 4D", "4D 5A"], "ref": "Chapter review", "body": "25 50"}, {"id": "e3", "ch": 5, "q": "Which signature prefix suggests ZIP?", "a": "50 4B", "wrong": ["25 50", "47 49", "89 50"], "ref": "Chapter review", "body": "50 4B"}, {"id": "e4", "ch": 5, "q": "Which signature prefix suggests PNG?", "a": "89 50", "wrong": ["50 4B", "42 4D", "49 44"], "ref": "Chapter review", "body": "89 50"}, {"id": "e5", "ch": 5, "q": "Which pair shares the abbreviated RIFF prefix 52 49 in the slides?", "a": "WAV and AVI", "wrong": ["JPEG and PNG", "EXE and BMP", "PDF and ZIP"], "ref": "Chapter review", "body": "WAV and AVI"}, {"id": "e6", "ch": 5, "q": "Which NTFS structure tracks volume cluster allocation?", "a": "Cluster bitmap", "wrong": ["UserAssist", "TCC database", "Received chain"], "ref": "Chapter review", "body": "Cluster bitmap"}, {"id": "e7", "ch": 5, "q": "Which tool is associated with Windows filesystem consistency checking?", "a": "chkdsk", "wrong": ["fsck", "pstree", "grep"], "ref": "Chapter review", "body": "chkdsk"}, {"id": "e8", "ch": 6, "q": "Which tool reports logged-on users?", "a": "PsLoggedOn", "wrong": ["PsList", "ListDLLs", "Scalpel"], "ref": "Chapter review", "body": "PsLoggedOn"}, {"id": "e9", "ch": 6, "q": "Which tool reports network connections?", "a": "netstat", "wrong": ["PsInfo", "ListDLLs", "fsutil only"], "ref": "Chapter review", "body": "netstat"}, {"id": "e10", "ch": 6, "q": "Which Registry root is for the current user?", "a": "HKCU", "wrong": ["HKLM", "HKCR", "HKCC"], "ref": "Chapter review", "body": "HKCU"}, {"id": "e11", "ch": 6, "q": "Under the class rule, a same-volume copy normally gets which permissions?", "a": "Destination-folder inherited permissions", "wrong": ["Always the source permissions unchanged", "No permissions", "Only administrator permissions"], "ref": "Chapter review", "body": "Destination-folder inherited permissions"}, {"id": "e12", "ch": 6, "q": "What does MAC mean in the file-timestamp discussion?", "a": "Modified, Accessed, Created", "wrong": ["Media Access Control", "Macintosh Application Cache", "Memory Allocation Count"], "ref": "Chapter review", "body": "Modified, Accessed, Created"}, {"id": "e13", "ch": 6, "q": "Which Windows artifact is the paging file?", "a": "pagefile.sys", "wrong": ["hiberfil.sys", "ntoskrnl.exe", "boot.ini"], "ref": "Chapter revi Subject: Account verification</pre><details><summary>What can you infer, and what needs verification?</summary><p>The apparent route is client → relay → inbox. The top Received line is newer. Replies go to a different address from From. Verify which servers supplied the headers, authentication results, logs, and timestamps. The display name alone does not prove campus IT sent it; neither line alone identifies a human.</p></details></section><section class="card"><h2>One-sentence answers to practice</h2><ol><li>Why image and hash before repairing a disk?</li><li>Where would you look for a Linux web-server request?</li><li>Why collect RAM before a shutdown?</li><li>Why can a renamed .jpg actually be an executable?</li><li>Why might a deleted email remain on a server?</li></ol><details><summary>Check your reasoning</summary><p>1. Preserve evidence and verify integrity. 2. Relevant web-server logs, such as /var/log/apache2/. 3. Volatile contents can disappear. 4. Extensions can be changed; inspect file signatures. 5. Retention, archives, backups, or other copies may remain.</p></details></section></div>`}

ation specifications</a></li><li><a href="https://bja.ojp.gov/program/it/privacy-civil-liberties/authorities/statutes/1285">DOJ: ECPA overview</a></li><li><a href="https://ndcac.fbi.gov/calea">FBI: CALEA</a></li><li><a href="https://www.intelligence.gov/foreign-intelligence-surveillance-act/categories-of-fisa">U.S. Intelligence Community: FISA</a></li><li><a href="https://www.ftc.gov/business-guidance/resources/can-spam-act-compliance-guide-business">FTC: CAN-SPAM overview</a></li><li><a href="https://uscode.house.gov/view.xhtml?req=granuleid:USC-prelim-title18-section2252B&amp;num=0&amp;edition=prelim">U.S. Code: 18 USC 2252B</a></li></ul><p class="sub">Technical clarification sources checked October 28, 2026. Legal definitions are exam-oriented summaries, not advice for conducting a real investigation.</p></section><section class="card"><h2>Take your study kit with you.</h2><p>Download this complete page for offline use, or save the guide and flashcards. Browser progress does not automatically sync. Export from one device and import on another.</p><div class="row"><button onclick="download('CYBER454-Exam2.html','<!doctype html>'+document.documentElement.outerHTML,'text/html')">Download offline site</button><button onclick="download('CYBER454-progress.json',JSON.stringify(saved,null,2),'application/json')">Export progress</button><button onclick="$('#import').click()">Import progress</button><input hidden id="import" type="file" accept="application/json"><a class="download" href="Study%20Guide.md" download>Written guide</a><a class="download" href="Flashcards.tsv" download>Flashcard TSV</a></div><p id="importStatus" role="status"></p><p class="sub">Offline HTML includes all study content. External reference links and separate downloads need internet. Reading progress and completed quiz results save locally; an unfinished quiz is not restored after reload.</p></section></div>`;$('#import').onchange=async e=>{try{const v=JSON.parse(await e.target.files[0].text());const validIds=new Set(DATA.cards.map(x=>x.id));for(const k of ['known','read','missed','plan']){if(!Array.isArray(v[k])||!v[k].every(x=>typeof x==='string'))throw Error('Invalid progress file');saved[k]=v[k].filter(x=>k==='plan'?/^p[1-8]$/.test(x):validIds.has(x))}persist();$('#importStatus').textContent='Progress imported successfully.'}catch{$('#importStatus').textContent='Could not import. Choose a progress JSON exported from this study site.'}}}
