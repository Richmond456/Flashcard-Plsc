name: Generate citizenship study audio
on:
  workflow_dispatch:
  push:
    paths:
      - citizenship/tools/generate_audio.py
      - .github/workflows/study-audio.yml
permissions:
  contents: write
jobs:
  audio:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install speech tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          pip install ptts==0.7.1
      - name: Generate natural voice recordings
        run: |
          mkdir -p citizenship/audio
          python -u citizenship/tools/generate_audio.py
      - name: Save generated recordings
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add citizenship/audio/*.mp3 citizenship/audio-manifest.js
          if ! git diff --cached --quiet; then
            git commit -m 'Generate natural voice recordings for citizenship study'
            git push origin HEAD:main
          fi
