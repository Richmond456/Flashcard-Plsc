  cursor: var(--cursor-interaction, default);
}

.form-select:not(:disabled):hover {
  background-color: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-check {
  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {
  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: var(--corner-shape);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible,
.nav-link:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

@media (pointer: coarse) {
  .btn,
  .nav-link,
  .form-control,
  .form-select {
    min-width: 44px;
    min-height: 44px;
  }

  /* Keep small-screen WebKit from zooming when a text field receives focus. */
  .form-control,
  .form-select {
    font-size: max(16px, var(--font-size-normal));
  }

  .form-control[type=&quot;file&quot;]::file-selector-button {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control-color[type=&quot;color&quot;] {
    width: 44px;
    height: 44px;
  }

  .form-control:is(
    [type=&quot;date&quot;],
    [type=&quot;datetime-local&quot;],
    [type=&quot;month&quot;],
    [type=&quot;time&quot;],
    [type=&quot;week&quot;]
  ) {
    min-width: 0;
    max-width: 100%;
    padding-block: 8px;
  }

  .form-check {
    min-height: 44px;
    padding-inline: 15px;
  }

  .form-check-input {
    position: relative;
  }

  .form-check-input::after {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 44px;
    height: 44px;
    content: &quot;&quot;;
    transform: translate(-50%, -50%);
  }

  .form-check-label {
    display: inline-flex;
    min-width: 44px;
    min-height: 44px;
    align-items: center;
  }

  .form-range {
    height: 44px;
    touch-action: pan-y;
  }

  .form-range::-webkit-slider-runnable-track {
    height: 44px;
  }

  .form-range::-moz-range-track {
    height: 44px;
  }

  .form-range::-webkit-slider-thumb {
    margin-top: 12px;
  }
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {

  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

&lt;script type=&quot;application/json&quot; id=&quot;codex-visualization-widget-state&quot;&gt;__CODEX_VISUALIZATION_WIDGET_STATE__&lt;/script&gt;
&lt;script&gt;(() =&gt; {
  const root = document.documentElement;
  const mediaQuery = globalThis.matchMedia(&quot;(prefers-color-scheme: dark)&quot;);
  const apply = Reflect.apply;
  const isArray = Array.isArray;
  const hasOwn = Object.hasOwn;
  const parentWindow = globalThis.parent;
  const stringify = JSON.stringify;
  const parse = JSON.parse;
  const encode = TextEncoder.prototype.encode.bind(new TextEncoder());
  const initialStateElement = document.getElementById(
    &quot;codex-visualization-widget-state&quot;,
  );
  const initialGlobals = parse(initialStateElement?.textContent ?? &quot;{}&quot;);
  initialStateElement?.remove();
  /** @type {Record&lt;string, unknown&gt; | null} */
  let state = initialGlobals.widgetState ?? null;
  const statePersistence = initialGlobals.statePersistence ?? &quot;none&quot;;
  let nextStateRequestId = 0;
  /** @type {Map&lt;number, { resolve: () =&gt; void; reject: (error: Error) =&gt; void; timeout: ReturnType&lt;typeof globalThis.setTimeout&gt;; serializedState: string }&gt;} */
  const pendingStateWrites = new Map();
  const persistenceError = () =&gt;
    Object.assign(
      new Error(&quot;The host could not persist the widget state update&quot;),
      {
        code: -32000,
        data: { code: &quot;widget_state_persistence_failed&quot;, retryable: false },
      },
    );

   * @param {object} prototype
   * @param {string} property
   */
  const getPrototypeGetter = (prototype, property) =&gt; {
    // oxlint-disable-next-line typescript/unbound-method -- invoked through captured Reflect.apply
    const getter = Object.getOwnPropertyDescriptor(prototype, property)?.get;
    if (getter == null) {
      throw new Error(`Missing ${property} getter`);
    }
    return getter;
  };
  const getMessageData = getPrototypeGetter(MessageEvent.prototype, &quot;data&quot;);
  const getMessagePorts = getPrototypeGetter(MessageEvent.prototype, &quot;ports&quot;);
  const getMessageSource = getPrototypeGetter(MessageEvent.prototype, &quot;source&quot;);
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const addHostMessageListener = MessagePort.prototype.addEventListener;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const postHostMessage = MessagePort.prototype.postMessage;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const startHostPort = MessagePort.prototype.start;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const stopMessagePropagation = Event.prototype.stopImmediatePropagation;

  let hostPort = null;
  const postToHost = (type, payload) =&gt; {
    if (hostPort != null) {
      apply(postHostMessage, hostPort, [{ type, ...payload }]);
    }
  };
  const openExternal = ({ href }) =&gt; {
    if (globalThis.navigator.userActivation?.isActive === true) {
      postToHost(&quot;open-external&quot;, { href });
    }
  };

    if (globalThis.navigator.userActivation?.isActive === true) {
      postToHost(&quot;follow-up&quot;, { context, prompt, title });
    }
    return Promise.resolve();

  /**
   * @param {Record&lt;string, unknown&gt; | ((previous: Record&lt;string, unknown&gt; | null) =&gt; Record&lt;string, unknown&gt;)} next
   * @returns {Promise&lt;void&gt;}
   */
  const setWidgetState = async (next) =&gt; {
    const nextState = typeof next === &quot;function&quot; ? next(state) : next;
    if (
      nextState == null ||
      typeof nextState !== &quot;object&quot; ||
      isArray(nextState)
    ) {
      throw new TypeError(&quot;Widget state must be a JSON object&quot;);
    }

      nextState,
      (_key, /** @type {unknown} */ value) =&gt; {
        if (
          typeof value === &quot;undefined&quot; ||
          typeof value === &quot;function&quot; ||
          typeof value === &quot;symbol&quot; ||
          (typeof value === &quot;number&quot; &amp;&amp; !Number.isFinite(value))

          throw new TypeError(&quot;Widget state must be a JSON object&quot;);
        }
        return value;
      },
    );
    const parsedState = parse(inputState);
    if (
      parsedState == null ||
      typeof parsedState !== &quot;object&quot; ||
      isArray(parsedState)
    ) {
      throw new TypeError(&quot;Widget state must be a JSON object&quot;);
    }
    const storedState = {
      modelContent: null,
      privateContent: null,
      ...parsedState,
    };

    if (encode(serializedState).length &gt; 16 * 1024) {
      throw new TypeError(
        &quot;Widget state must be a JSON object of at most 16 KiB&quot;,

    }
    if (
      hasOwn(storedState, &quot;imageIds&quot;) &amp;&amp;

        storedState.imageIds.some(
          (/** @type {unknown} */ id) =&gt; typeof id !== &quot;string&quot;,

      throw new TypeError(&quot;Widget state imageIds must be an array of strings&quot;);
    }
    if (storedState.imageIds?.length &gt; 0) {

        new TypeError(&quot;Visualization state does not support image attachments&quot;),

    globalThis.openai.widgetState = state;
    globalThis.dispatchEvent(
      new CustomEvent(&quot;openai:set_globals&quot;, {

    );

      throw persistenceError();
    }
    const id = ++nextStateRequestId;
    return new Promise((resolve, reject) =&gt; {
      const timeout = globalThis.setTimeout(() =&gt; {
        pendingStateWrites.delete(id);
        reject(persistenceError());
      }, 30_000);
      pendingStateWrites.set(id, { resolve, reject, timeout, serializedState });
      postToHost(&quot;widget-state-write&quot;, { id, state: serializedState });
    });
  };
  const syncTheme = () =&gt; {
    const theme = mediaQuery.matches ? &quot;dark&quot; : &quot;light&quot;;
    root.dataset.theme = theme;
    globalThis.openai = {
      ...globalThis.openai,
      openExternal,
      sendFollowUpMessage,
      setWidgetState,
      theme,
      visualizationStyleVariables: {},
      visualizationTheme: theme,
      widgetState: state,
      statePersistence,
      stateModelContext: &quot;none&quot;,
    };
    globalThis.dispatchEvent(
      new CustomEvent(&quot;openai:set_globals&quot;, {
        detail: { globals: globalThis.openai },
      }),
    );
  };
  const sendHeight = () =&gt; {
    postToHost(&quot;height&quot;, {
      height: Math.ceil(
        Math.max(
          document.body.scrollHeight,
          document.body.getBoundingClientRect().height,
        ),
      ),
    });
  };

  globalThis.addEventListener(
    &quot;message&quot;,
    (event) =&gt; {
      const data = apply(getMessageData, event, []);
      const ports = apply(getMessagePorts, event, []);
      const source = apply(getMessageSource, event, []);
      if (
        hostPort != null ||
        source !== parentWindow ||
        typeof data !== &quot;object&quot; ||
        data?.type !== &quot;codex-visualization-initialize&quot; ||
        !isArray(ports) ||
        ports.length !== 1
      ) {
        return;
      }
      apply(stopMessagePropagation, event, []);
      const nextHostPort = ports[0];
      try {
        apply(addHostMessageListener, nextHostPort, [
          &quot;message&quot;,
          (event) =&gt; {
            const data = apply(getMessageData, event, []);
            if (typeof data === &quot;object&quot; &amp;&amp; data?.type === &quot;measure&quot;) {
              sendHeight();
            } else if (
              typeof data === &quot;object&quot; &amp;&amp;
              data?.type === &quot;widget-state-result&quot;
            ) {
              /** @type {unknown} */
              const id = data.id;
              if (typeof id !== &quot;number&quot;) {
                return;
              }
              const pending = pendingStateWrites.get(id);
              if (pending != null) {
                pendingStateWrites.delete(id);
                globalThis.clearTimeout(pending.timeout);
                if (data.ok === true) {
                  pending.resolve();
                } else {
                  pending.reject(persistenceError());
                }
              }
            }
          },
        ]);
        apply(startHostPort, nextHostPort, []);
      } catch {
        return;
      }
      hostPort = nextHostPort;
      for (const [id, { serializedState }] of pendingStateWrites) {
        postToHost(&quot;widget-state-write&quot;, { id, state: serializedState });
      }
      sendHeight();
    },
    { capture: true },
  );
  document.currentScript?.remove();
  mediaQuery.addEventListener(&quot;change&quot;, syncTheme);
  globalThis.addEventListener(&quot;click&quot;, (event) =&gt; {
    if (event.defaultPrevented) {
      return;
    }
    let element = null;
    if (event.target instanceof globalThis.Element) {
      element = event.target;
    } else if (event.target instanceof globalThis.Node) {
      element = event.target.parentElement;
    }
    const link = element?.closest(&quot;a[href]&quot;);
    const href = link?.getAttribute(&quot;href&quot;);
    if (href == null) {
      return;
    }
    if (href.startsWith(&quot;#&quot;)) {
      let id;
      try {
        id = decodeURIComponent(href.slice(1));
      } catch {
        return;
      }
      const target = id.length === 0 ? root : document.getElementById(id);
      if (
        target == null ||
        globalThis.navigator.userActivation?.isActive !== true

        return;
      }

      postToHost(&quot;scroll-to&quot;, {
        top: target.getBoundingClientRect().top + globalThis.scrollY,
      });
      return;
    }

    openExternal({ href });
  });

  syncTheme();
})();

&lt;script type=&quot;application/json&quot; id=&quot;cyber454-data&quot;&gt;{&quot;chapters&quot;: [&quot;Introduction to Forensics&quot;, &quot;Overview of Computer Crime&quot;, &quot;Forensic Methods and Labs&quot;, &quot;Hiding and Scrambling Information&quot;], &quot;cards&quot;: [[1, &quot;3–7&quot;, &quot;What is the goal of computer forensics?&quot;, &quot;Identify, collect, examine, preserve, analyze, and present digital material so it can support an investigation and be used as evidence. Collection affects admissibility; analysis connects the facts; presentation explains the findings.&quot;], [1, &quot;12–13&quot;, &quot;What makes raw data relevant evidence?&quot;, &quot;Its connection to the investigation and the finding it supports. A random file is not useful evidence merely because it exists. The four listed categories are real (the item itself), documentary (records/documents), testimonial (witness statements), and demonstrative (illustrations or models used to explain evidence).&quot;], [1, &quot;16&quot;, &quot;What is chain of custody?&quot;, &quot;The documented history of who held or transferred an item of evidence, when, and for what purpose. It helps establish that the item presented is the item collected and that its handling can be accounted for.&quot;], [1, &quot;16&quot;, &quot;What are the four general evidence-handling guidelines?&quot;, &quot;Maintain chain of custody; interact with the suspect device as little as possible; create a document trail; secure evidence. Think: preserve the evidence and make your actions explainable.&quot;], [1, &quot;8–10&quot;, &quot;Expert report versus expert testimony?&quot;, &quot;The report records tests, findings, and conclusions and includes the examiner&#x27;s CV. The slides call for thorough, error-free reporting and reputable support for conclusions. Testimony is the examiner&#x27;s spoken evidence; a deposition occurs before trial.&quot;], [1, &quot;9–10&quot;, &quot;Which evidence rules are named in Chapter 1?&quot;, &quot;702: expert testimony; 703: bases of an expert opinion; 704: opinion on an ultimate issue; 705: underlying facts/data; 706: court-appointed experts; 401: relevance. These are course-slide associations, not a full statement of the rules.&quot;], [1, &quot;29–30&quot;, &quot;What factors does the chapter list for the Daubert standard?&quot;, &quot;Empirical testing, peer review, error rate and standards, and general acceptance. The chapter connects these factors to evaluating scientific expert testimony. Memory cue: test, review, error/standards, acceptance.&quot;], [1, &quot;14–15&quot;, &quot;What makes a forensic investigation difficult?&quot;, &quot;Data volume, system complexity, the size and character of the scene, and caseload/resource limits. Analysis may involve storage media, email, networks, internet activity, software, live systems, and mobile devices.&quot;], [1, &quot;18–23&quot;, &quot;What hardware and file-system names should you recognize?&quot;, &quot;Memory and storage; SCSI, IDE, EIDE, PATA, SATA; SSD flash storage versus mechanical HDDs. File systems listed: FAT, NTFS, ReFS, APFS, EXT, and Berkeley Fast File System. A file is stored content; a file system organizes storage.&quot;], [1, &quot;24–27&quot;, &quot;MAC address, IP address, logical port, and URL: how do they differ?&quot;, &quot;MAC: link-layer interface identifier. IP: network-layer address. Logical port: identifies a service/communication endpoint on a host. URL: a resource address. A physical port is a connector, not a TCP/UDP port number.&quot;], [1, &quot;25–27&quot;, &quot;What do ipconfig, ping, and tracert help examine?&quot;, &quot;ipconfig displays local IP configuration; ping tests whether a destination responds to network probes; tracert shows the responding hops along a route. A failed ping alone does not prove the destination is down.&quot;], [1, &quot;28&quot;, &quot;Obscured information versus anti-forensics?&quot;, &quot;Obscuring can have legitimate purposes, such as protecting business information. Anti-forensics deliberately frustrates investigation through destruction, hiding, transformation, or file-system alteration. Encryption alone does not establish criminal intent.&quot;], [1, &quot;31–37&quot;, &quot;Which legal topics need recognition?&quot;, &quot;Review the slides&#x27; names: Privacy Act, PPA, CALEA, ECPA, Computer Security Act, FISA, child protection/privacy laws, Communications Decency Act, Telecommunications Act, Wireless Communications and Public Safety Act, PATRIOT Act, Sarbanes-Oxley, computer/access-device fraud, DMCA, identity theft, and warrants. Learn the instructor&#x27;s associations; this is course review, not current legal guidance.&quot;], [1, &quot;34, 37&quot;, &quot;What are the chapter&#x27;s CALEA, FISA, and warrant associations?&quot;, &quot;CALEA: assistance with lawful interception of communications. FISA: foreign-intelligence surveillance and the FISA court. Warrants: search and seizure, the Fourth Amendment, and reasonable expectations of privacy. Review the original pages for the course wording.&quot;], [1, &quot;3–4&quot;, &quot;What are the seven IT infrastructure domains?&quot;, &quot;User, Workstation, LAN, LAN-to-WAN, WAN, Remote Access, and System/Application. Digital evidence can arise across all seven, so investigation is not limited to a desktop hard drive.&quot;], [2, &quot;3&quot;, &quot;What three roles can a computer play in crime?&quot;, &quot;Target: the system is attacked. Instrument: it is used to commit the act. Evidence repository: it stores relevant records. Example: a laptop used to send fraudulent messages is an instrument and can also hold evidence.&quot;], [2, &quot;6–8, 12&quot;, &quot;How do identity theft, phishing, and dumpster diving connect?&quot;, &quot;Identity theft uses someone else&#x27;s identity, often for economic gain. Phishing tricks people into revealing information. Discarded information can also expose identity details; collecting it is often called dumpster diving.&quot;], [2, &quot;8&quot;, &quot;Phishing, spear phishing, and whaling?&quot;, &quot;Phishing commonly casts a broad net using trusted-looking messages. Spear phishing targets a particular person or group. Whaling is targeted phishing aimed at high-profile or senior individuals.&quot;], [2, &quot;9–11&quot;, &quot;What evidence would you seek in a spyware or phishing case?&quot;, &quot;For spyware, look for monitoring software and where it sends data, such as email attachments or server traffic. For phishing, inspect email and browser history. Spyware can monitor keystrokes or screenshots; its use is not always illegal.&quot;], [2, &quot;14–15&quot;, &quot;SQL injection versus cross-site scripting (XSS)?&quot;, &quot;SQL injection manipulates a database query through input; the slides point to firewall and database logs. XSS inserts script into web content so it executes for visitors; inspect injected scripts and web-server logs. Database query versus browser script is the key contrast.&quot;], [2, &quot;16–18&quot;, &quot;What is the Ophcrack/rainbow-table connection?&quot;, &quot;Ophcrack uses precomputed password-hash information to seek matches to Windows password hashes in the chapter&#x27;s example. The SAM file stores Windows account credential information. A table lookup is not reversing a one-way hash.&quot;], [2, &quot;19–20&quot;, &quot;How do human behavior and credibility affect investigation?&quot;, &quot;The tech-support example exploits a privileged user&#x27;s actions. For cyberstalking, assess possibility, credibility, frequency, and seriousness, then trace communications and examine relevant devices. The person is the target; the computer is the vehicle.&quot;], [2, &quot;23&quot;, &quot;What is the forensic approach to fraud?&quot;, &quot;Fraud seeks financial reward through deception. Trace communications and follow the money. Messages may show the deception; transaction records may show where funds went.&quot;], [2, &quot;24–26&quot;, &quot;What is the TCP handshake, and how does a SYN flood disrupt it?&quot;, &quot;Normal sequence: SYN → SYN/ACK → ACK. In the slides&#x27; SYN-flood example, the attacker sends SYN requests but does not finish the handshake, consuming connection resources and denying service to legitimate users.&quot;], [2, &quot;28&quot;, &quot;What virus categories are listed?&quot;, &quot;Macro, memory-resident, multi-partite, armored, sparse infector, and polymorphic. Know the names and review any definitions supplied in class. Investigators document the malware and look for common exposure across infected machines; finding it does not automatically identify its author.&quot;], [2, &quot;29&quot;, &quot;What distinguishes a logic bomb?&quot;, &quot;A harmful action is triggered when a condition is met, often a date or time. A Trojan horse can carry a logic bomb. The trigger condition is the defining clue.&quot;], [2, &quot;24, 30&quot;, &quot;What are the chapter&#x27;s non-access crime and cyberterrorism examples?&quot;, &quot;The slides group DoS, viruses, and logic bombs under non-access crimes. Cyberterrorism can involve major network or power-grid disruption. The chapter emphasizes that jurisdiction changes and refers cyberterrorism/cyberespionage matters to the FBI.&quot;], [3, &quot;3&quot;, &quot;What four forensic-methodology principles are listed?&quot;, &quot;Minimize handling original data, comply with evidence rules, stay within your expertise, and create an analysis plan. Decide what you need to establish before using tools.&quot;], [3, &quot;4–5&quot;, &quot;What is the basic authentication idea in Rule 901?&quot;, &quot;Support a finding that an item is what you claim it is. The slides mention a knowledgeable witness, comparison with an authenticated specimen, and evidence that a process produces accurate results. Rules 901 and 902 are named for authentication/identification.&quot;], [3, &quot;6–7&quot;, &quot;What does order of volatility mean?&quot;, &quot;Prioritize information likely to disappear or change first. Registers/cache and live memory are more volatile than stored disk data. Consider information lifetime and collect quickly while preserving bit-level information. Do not automatically power off a live system before considering volatile evidence.&quot;], [3, &quot;6&quot;, &quot;What is the slide&#x27;s example order of volatility?&quot;, &quot;Registers/cache → routing tables → ARP cache → process table → kernel statistics/modules → main memory → temporary file systems → secondary memory → router configuration → network topology. This is the chapter&#x27;s example order; understand the principle as well as the list.&quot;], [3, &quot;8&quot;, &quot;Which forensic frameworks are named?&quot;, &quot;DC3 (DoD Cyber Crime Center), DFRWS (Digital Forensic Research Workshop), SWGDE (Scientific Working Group on Digital Evidence), and Purdue&#x27;s event-based investigation framework.&quot;], [3, &quot;9–10&quot;, &quot;Find, preserve, prepare: what happens at each stage?&quot;, &quot;Find: gather evidence and isolate it from contamination. Preserve: handle computers and storage cautiously. Prepare: document the source and establish that evidence has not changed. Also determine when it was created, search thoroughly, and present it clearly.&quot;], [3, &quot;11–12&quot;, &quot;What is file slack?&quot;, &quot;Unused space from a file&#x27;s logical end to the end of its allocated storage unit. A 1 KB file in one 4 KB cluster leaves 3 KB of slack. That space may retain useful remnants. It is not the same as all unallocated space on the disk.&quot;], [3, &quot;13–14&quot;, &quot;Why document methodology as well as findings?&quot;, &quot;A result must be supported by a traceable process. Record evidence processing, maintain chain of custody, and explain findings thoroughly. Another reader should be able to understand how the conclusion follows from the examination.&quot;], [3, &quot;15–16&quot;, &quot;What does the chapter require in a forensic lab?&quot;, &quot;Adequate equipment/storage, redundancy, drive/device compatibility, and suitable connectors. Security includes isolated examination systems/networks, limited physical access, secured doors/windows, and attention to electromagnetic interference. The slide specifically recommends RAID 5.&quot;], [3, &quot;18–19&quot;, &quot;Match 27037, 27041, and 27042 to their focus.&quot;, &quot;27037: identification, collection, acquisition, preservation. 27041: suitability and adequacy of investigative methods. 27042: analysis and interpretation. Memory sequence: collect → choose sound methods → analyze.&quot;], [3, &quot;20–22&quot;, &quot;NIST CFTT, ASCLD, and TEMPEST: which is which?&quot;, &quot;NIST CFTT tests computer-forensic tools. ASCLD is discussed in relation to lab management and accreditation. TEMPEST concerns electromagnetic emissions. These are different from an individual examiner&#x27;s certification.&quot;], [3, &quot;23–28&quot;, &quot;Which forensic tool names should you recognize?&quot;, &quot;EnCase, FTK, OSForensics, Helix, Kali Linux, AnaDisk, CopyQM Plus, The Sleuth Kit, Disk Investigator, and Autopsy. The slides show case viewing, search, and email-analysis screens. A tool&#x27;s output still needs interpretation and documentation.&quot;], [3, &quot;29–30&quot;, &quot;General IT certifications versus forensic certifications?&quot;, &quot;General foundations listed include A+, Network+/CCNA, Security+/CISSP, CEH, and GPEN. Forensic credentials listed include EnCase Certified Examiner, AccessData Certified Examiner, OSForensics, CHFI, and GIAC certifications. Recognize the category and associated tool/organization.&quot;], [4, &quot;3, 18–19&quot;, &quot;Steganography versus encryption?&quot;, &quot;Steganography hides that a message exists. Encryption makes its content unreadable without the appropriate key. You can encrypt a message and then hide it inside an image; the techniques can be combined.&quot;], [4, &quot;4–7&quot;, &quot;How does least-significant-bit steganography work?&quot;, &quot;Replace low-value bits in a carrier with hidden data. Changing 11111111 (255) to 11111110 (254) changes the numeric value by only one. Such a small color change may be difficult to notice visually.&quot;], [4, &quot;7, 9&quot;, &quot;Payload, carrier, channel, and steganophony?&quot;, &quot;Payload: hidden information. Carrier: the file or medium holding it, such as an image. Channel: the path/medium used to communicate it. Steganophony hides information in sound; video steganography uses video.&quot;], [4, &quot;10–17&quot;, &quot;What is steganalysis, and which hiding tools are named?&quot;, &quot;Steganalysis looks for hidden content; the slides mention close-color pairs for LSB detection. Invisible Secrets, MP3Stego, and Deep Sound are named hiding tools. Detecting a likely hidden payload is different from recovering its contents.&quot;], [4, &quot;20–21&quot;, &quot;Plaintext, ciphertext, and Caesar cipher?&quot;, &quot;Plaintext is the original readable message; ciphertext is the encrypted result. Caesar shifts each letter by a fixed amount. With a +3 shift, A CAT becomes D FDW. Decryption shifts back by 3.&quot;], [4, &quot;22–23&quot;, &quot;Atbash, ROT13, and Scytale?&quot;, &quot;Atbash reverses the alphabet (A↔Z, B↔Y). ROT13 shifts by 13; applying it twice restores the original letters. Scytale uses a strip wrapped around a matching cylinder and illustrates rearrangement of character positions.&quot;], [4, &quot;24–27&quot;, &quot;What are the Playfair cipher&#x27;s core features?&quot;, &quot;Playfair encrypts letter pairs using a 5x5 keyword grid (the slides combine I/J). To encrypt: split into pairs, separating repeated letters within a pair and padding a final single letter with a filler, commonly X; same row -&gt; take the letter to the right, wrapping; same column -&gt; take the letter below, wrapping; otherwise -&gt; use the other rectangle corners, keeping each letter in its original row. In the slide grid, the first row is F A L C O: FA encrypts to AL. A and T form a rectangle and encrypt to C and R. Decryption reverses row/column movement.&quot;], [4, &quot;28–30&quot;, &quot;How do multialphabet substitution, Vigenère, and Enigma connect?&quot;, &quot;They use changing substitution alphabets rather than one fixed alphabet. Vigenère uses a repeated keyword pattern; the chapter displays its table. Enigma used electromechanical rotors, changing the substitution as typing progressed.&quot;], [4, &quot;31–32, 41&quot;, &quot;Symmetric versus asymmetric cryptography?&quot;, &quot;Symmetric encryption/decryption uses the same secret key for a communication direction. Asymmetric cryptography uses a related pair of different keys. Having separate symmetric keys in two directions does not make a system asymmetric.&quot;], [4, &quot;33&quot;, &quot;Substitution versus transposition?&quot;, &quot;Substitution changes the symbols/values. Transposition changes their positions. Combining the operations makes patterns harder to exploit. Memory cue: substitute = replace; transpose = rearrange.&quot;], [4, &quot;34&quot;, &quot;Block cipher versus stream cipher?&quot;, &quot;A block cipher processes fixed-size groups of bits. A stream cipher processes a stream incrementally; the slides describe one bit at a time. Do not confuse block size with key size.&quot;], [4, &quot;35–37&quot;, &quot;What numbers matter for DES and 3DES?&quot;, &quot;DES: 64-bit block, 56-bit effective key, 16 rounds. The chapter describes 3DES as applying DES three times with three different keys. Three passes do not turn the block size into 192 bits.&quot;], [4, &quot;38&quot;, &quot;What are AES key sizes and block size?&quot;, &quot;Keys: 128, 192, or 256 bits. Block size: always 128 bits for AES. AES-256 describes the key length, not a 256-bit block. The chapter also names Rijndael.&quot;], [4, &quot;39&quot;, &quot;What happens in AES rounds?&quot;, &quot;After key expansion: initial AddRoundKey; main rounds use SubBytes, ShiftRows, MixColumns, AddRoundKey; final round uses SubBytes, ShiftRows, AddRoundKey. The final round omits MixColumns.&quot;], [4, &quot;40&quot;, &quot;What three hash properties are listed?&quot;, &quot;One-way, fixed-length output for a given algorithm regardless of input length, and collision resistance. Hashing is not reversible encryption. Collision resistance means finding matching outputs for different inputs should be difficult, not mathematically impossible.&quot;], [4, &quot;42–43&quot;, &quot;RSA versus Diffie–Hellman?&quot;, &quot;RSA is asymmetric and relies on the difficulty of factoring large integers. Diffie–Hellman lets two parties establish a shared secret over an insecure channel. Key agreement is its role; it is not itself the message-encryption step.&quot;], [4, &quot;44–46&quot;, &quot;Frequency analysis versus Kasiski examination?&quot;, &quot;Frequency analysis exploits uneven letter frequencies in classic ciphers. Kasiski looks for repeated ciphertext strings to infer a repeating keyword&#x27;s length; the ciphertext can then be split into columns for frequency analysis.&quot;], [4, &quot;44, 47&quot;, &quot;Known-plaintext, chosen-plaintext, and ciphertext-only attacks?&quot;, &quot;Known-plaintext: some original messages and corresponding ciphertexts are available. Chosen-plaintext: the attacker can choose inputs and obtain their ciphertexts. Ciphertext-only: only encrypted messages are available. Ask what information or access the attacker has.&quot;], [4, &quot;44, 47–49&quot;, &quot;Related-key attacks, rainbow tables, and John the Ripper?&quot;, &quot;Related-key attacks exploit relationships between keys. Rainbow tables precompute information used in password-hash matching. The slides associate Ophcrack with rainbow tables and John the Ripper with word-list password attempts. Guessing then checking hashes does not decrypt a hash.&quot;], [4, &quot;50&quot;, &quot;Why does the chapter discuss quantum computing?&quot;, &quot;Sufficiently capable quantum computers threaten the factoring and discrete-log problems used by RSA and Diffie–Hellman. Treat the slide as explaining a cryptographic threat model, not as a claim that today&#x27;s systems can already be broken at will.&quot;]], &quot;quiz&quot;: [[1, &quot;16&quot;, &quot;An evidence drive changes hands between examiners. What most directly records that transfer?&quot;, [&quot;Chain-of-custody record&quot;, &quot;Network route table&quot;, &quot;Cipher key schedule&quot;, &quot;Virus signature list&quot;], 0, &quot;Chain of custody accounts for possession and transfer of evidence.&quot;], [1, &quot;12&quot;, &quot;Which makes a file useful as evidence?&quot;, [&quot;It is the largest file&quot;, &quot;It supports a relevant finding in the investigation&quot;, &quot;It is stored on an SSD&quot;, &quot;It has an unusual extension&quot;], 1, &quot;Relevance to the case and a finding matters, not size or storage type.&quot;], [1, &quot;29–30&quot;, &quot;Which set matches the chapter&#x27;s Daubert factors?&quot;, [&quot;Speed, cost, popularity, file size&quot;, &quot;Encryption, compression, deletion, hashing&quot;, &quot;Testing, peer review, error rate/standards, general acceptance&quot;, &quot;IP, MAC, URL, port&quot;], 2, &quot;These are the four factor groups shown on Chapter 1 page 30.&quot;], [1, &quot;8–9&quot;, &quot;A document lists an examiner&#x27;s tests, findings, conclusions, and CV. What is it?&quot;, [&quot;A deposition&quot;, &quot;An expert report&quot;, &quot;A warrant&quot;, &quot;A packet capture&quot;], 1, &quot;An expert report is the written account. A deposition is pretrial testimony.&quot;], [1, &quot;9–10&quot;, &quot;Which rule is associated with expert testimony in the chapter?&quot;, [&quot;Rule 401&quot;, &quot;Rule 901&quot;, &quot;Rule 702&quot;, &quot;Rule 902&quot;], 2, &quot;The chapter links 702 to expert testimony and 401 to relevance; Chapter 3 discusses authentication under 901/902.&quot;], [1, &quot;24–27&quot;, &quot;Which utility is used to examine the responding hops toward a destination?&quot;, [&quot;ipconfig&quot;, &quot;tracert&quot;, &quot;A file hash&quot;, &quot;A keyword search&quot;], 1, &quot;tracert examines the route; ipconfig reports local IP configuration.&quot;], [1, &quot;24&quot;, &quot;Which item identifies a service endpoint rather than a physical connector?&quot;, [&quot;SATA connector&quot;, &quot;USB socket&quot;, &quot;Logical port number&quot;, &quot;Drive bay&quot;], 2, &quot;Logical ports belong to network communications. They are not physical sockets.&quot;], [1, &quot;28&quot;, &quot;A business encrypts confidential documents. What can you conclude from encryption alone?&quot;, [&quot;The owner committed a crime&quot;, &quot;The files contain no evidence&quot;, &quot;A warrant is unnecessary&quot;, &quot;The content is obscured; intent needs more evidence&quot;], 3, &quot;The chapter explicitly notes legitimate business uses for obscured information.&quot;], [1, &quot;34&quot;, &quot;Which topic is paired with foreign-intelligence surveillance and a specialized court?&quot;, [&quot;FISA&quot;, &quot;FAT&quot;, &quot;FTK&quot;, &quot;AES&quot;], 0, &quot;This is the association shown on Chapter 1 page 34.&quot;], [1, &quot;14, 16&quot;, &quot;An examiner has a large caseload and very complex devices. What is the best response among these choices?&quot;, [&quot;Skip handling records&quot;, &quot;Plan and prioritize while maintaining preservation and documentation&quot;, &quot;Change originals to make searching easier&quot;, &quot;Assume all files are relevant&quot;], 1, &quot;Resource limitations do not remove the need for documented, careful handling.&quot;], [2, &quot;3&quot;, &quot;A computer is used to send fraudulent investment messages. Which role best describes that use?&quot;, [&quot;Target only&quot;, &quot;Instrument of the crime&quot;, &quot;Lab accreditation authority&quot;, &quot;Physical warrant&quot;], 1, &quot;It is being used to carry out the act. It may also store relevant evidence.&quot;], [2, &quot;8&quot;, &quot;A deceptive message is tailored specifically to one company&#x27;s finance director. Which category best fits?&quot;, [&quot;Random broad phishing only&quot;, &quot;SYN flood&quot;, &quot;Targeted phishing / whaling&quot;, &quot;File slack&quot;], 2, &quot;Tailoring to a senior/high-profile target distinguishes this from broad phishing.&quot;], [2, &quot;11&quot;, &quot;Spyware is found on a victim&#x27;s device. What is a useful next evidence lead?&quot;, [&quot;Where it sends the captured data&quot;, &quot;Whether the desktop background changed&quot;, &quot;Only the screen size&quot;, &quot;The brand of keyboard&quot;], 0, &quot;The slides point to outgoing email/attachments or traffic to an attacker-accessible server.&quot;], [2, &quot;14–15&quot;, &quot;Input alters the logic of a backend database query. Which technique does this describe?&quot;, [&quot;Steganography&quot;, &quot;SQL injection&quot;, &quot;XSS&quot;, &quot;ROT13&quot;], 1, &quot;SQL injection changes database-query behavior. XSS runs injected script in a browser context.&quot;], [2, &quot;15&quot;, &quot;A malicious script in a product review runs when other people read the page. What is this?&quot;, [&quot;File slack&quot;, &quot;A logic bomb based only on date&quot;, &quot;Cross-site scripting&quot;, &quot;Disk imaging&quot;], 2, &quot;The chapter uses posted web content to illustrate XSS.&quot;], [2, &quot;23&quot;, &quot;Which investigative pair fits a financial fraud case?&quot;, [&quot;Trace communications and follow money&quot;, &quot;Ignore messages and inspect colors&quot;, &quot;Delete duplicates and discard originals&quot;, &quot;Check only CPU temperature&quot;], 0, &quot;Messages reveal the deception and financial records help trace the proceeds.&quot;], [2, &quot;25&quot;, &quot;Wh     panel.innerHTML=`&lt;h3&gt;Your route to Tuesday&lt;/h3&gt;&lt;p&gt;Use the loop: read a short section → recall it without looking → practice → revisit mistakes. Break longer blocks into 25 minutes of focus and a short break. If time is tight, prioritize your mistakes and the comparisons below.&lt;/p&gt;
    &lt;div class=&quot;viz-row&quot;&gt;${button(&#x27;Start mixed practice&#x27;,&#x27;mixed&#x27;,true)}${button(&#x27;Read Chapter 1&#x27;,&#x27;read-first&#x27;)}&lt;/div&gt;
    ${tasks.map((t,i)=&gt;`&lt;div class=&quot;study-block&quot;&gt;&lt;label class=&quot;form-check&quot;&gt;&lt;input class=&quot;form-check-input&quot; type=&quot;checkbox&quot; data-check=&quot;${i}&quot; ${state.checks.includes(i)?&#x27;checked&#x27;:&#x27;&#x27;}&gt;&lt;span class=&quot;form-check-label&quot;&gt;${t[0]}&lt;/span&gt;&lt;/label&gt;&lt;p&gt;${t[1]}&lt;/p&gt;&lt;/div&gt;`).join(&#x27;&#x27;)}
    &lt;h3&gt;Explain these without notes&lt;/h3&gt;&lt;ul&gt;&lt;li&gt;Chain of custody versus authentication; evidence versus raw data.&lt;/li&gt;&lt;li&gt;SQL injection versus XSS; phishing versus spyware; a virus versus a logic bomb.&lt;/li&gt;&lt;li&gt;Volatile data versus persistent storage; file slack versus unallocated space.&lt;/li&gt;&lt;li&gt;Steganography versus encryption versus hashing.&lt;/li&gt;&lt;li&gt;Symmetric versus asymmetric; block size versus key size; RSA versus Diffie–Hellman.&lt;/li&gt;&lt;li&gt;Known-plaintext versus chosen-plaintext versus ciphertext-only.&lt;/li&gt;&lt;/ul&gt;
    &lt;p class=&quot;text-small&quot;&gt;Suggested study order and time allocations are recommendations based on the chapter content, not confirmed instructor weighting. The actual exam&#x27;s question format has not been provided.&lt;/p&gt;`;
  }
  function renderRead(){
    const chapters=state.chapter?[state.chapter]:[1,2,3,4];
    panel.innerHTML=chapters.map(ch=&gt;`&lt;section class=&quot;study-block&quot;&gt;&lt;h3&gt;Chapter ${ch} · ${esc(data.chapters[ch-1])}&lt;/h3&gt;
    ${data.cards.filter(c=&gt;c[0]===ch).map(c=&gt;`&lt;article class=&quot;study-note&quot;&gt;&lt;h3&gt;${esc(c[2])}&lt;/h3&gt;&lt;p&gt;${esc(c[3])}&lt;/p&gt;${source(ch,c[1])}&lt;/article&gt;`).join(&#x27;&#x27;)}
    &lt;label class=&quot;form-check&quot;&gt;&lt;input type=&quot;checkbox&quot; class=&quot;form-check-input&quot; data-read=&quot;${ch}&quot; ${state.read.includes(ch)?&#x27;checked&#x27;:&#x27;&#x27;}&gt;&lt;span class=&quot;form-check-label&quot;&gt;I reviewed Chapter ${ch} and can explain its main ideas&lt;/span&gt;&lt;/label&gt;&lt;/section&gt;`).join(&#x27;&lt;hr&gt;&#x27;);
  }
  function renderCards(){
    const ids=cardIds();
    state.cardIndex=Math.max(0,Math.min(state.cardIndex,Math.max(0,ids.length-1)));
    const known=Object.values(state.marks).filter(v=&gt;v===&#x27;known&#x27;).length;
    panel.innerHTML=`&lt;div class=&quot;viz-controls&quot;&gt;&lt;label class=&quot;form-label&quot;&gt;Deck &lt;select id=&quot;deck-mode&quot; class=&quot;form-select&quot;&gt;&lt;option value=&quot;all&quot;&gt;All cards&lt;/option&gt;&lt;option value=&quot;again&quot;&gt;Review again&lt;/option&gt;&lt;/select&gt;&lt;/label&gt;&lt;span&gt;${known} / ${data.cards.length} marked known overall&lt;/span&gt;&lt;/div&gt;&lt;div id=&quot;card-area&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;`;
    root.querySelector(&#x27;#deck-mode&#x27;).value=state.deckMode;
    const area=root.querySelector(&#x27;#card-area&#x27;);
    if(!ids.length){area.innerHTML=&#x27;&lt;p&gt;No cards in this review pile yet. Reveal a card in All cards, then choose Review again when you need another attempt.&lt;/p&gt;&#x27;;return;}
    const id=ids[state.cardIndex], c=data.cards[id];
    area.innerHTML=`&lt;div class=&quot;study-card card&quot;&gt;&lt;div class=&quot;text-small&quot;&gt;Card ${state.cardIndex+1} of ${ids.length} · ${state.marks[id]===&#x27;known&#x27;?&#x27;Marked known&#x27;:state.marks[id]===&#x27;again&#x27;?&#x27;Review again&#x27;:&#x27;Not rated&#x27;}&lt;/div&gt;&lt;h3&gt;${esc(c[2])}&lt;/h3&gt;${revealed?`&lt;p&gt;${esc(c[3])}&lt;/p&gt;${source(c[0],c[1])}`:&#x27;&lt;p&gt;Say your answer aloud before revealing it.&lt;/p&gt;&#x27;}&lt;/div&gt;
    &lt;div class=&quot;viz-row&quot;&gt;${revealed?button(&#x27;Review again&#x27;,&#x27;again&#x27;)+button(&#x27;I know this&#x27;,&#x27;known&#x27;,true):button(&#x27;Reveal answer&#x27;,&#x27;reveal&#x27;,true)}${button(&#x27;Previous&#x27;,&#x27;prev-card&#x27;,false,state.cardIndex===0?&#x27;disabled&#x27;:&#x27;&#x27;)}${button(&#x27;Next&#x27;,&#x27;next-card&#x27;,false,state.cardIndex===ids.length-1?&#x27;disabled&#x27;:&#x27;&#x27;)}&lt;/div&gt;`;
  }
  function startQuiz(mode, chapter=0){
    state.quizMenu=false;
    let ids;
    if(mode===&#x27;exam&#x27;) ids=shuffle([1,2,3,4].flatMap(ch=&gt;shuffle(data.quiz.map((q,i)=&gt;q[0]===ch?i:-1).filter(i=&gt;i&gt;=0)).slice(0,ch===4?7:6)));
    else if(mode===&#x27;chapter&#x27;) ids=shuffle(data.quiz.map((q,i)=&gt;q[0]===chapter?i:-1).filter(i=&gt;i&gt;=0));
    else ids=shuffle(data.quiz.map((_,i)=&gt;i)).slice(0,10);
    state.quiz={mode,chapter,ids,orders:ids.map(i=&gt;shuffle(data.quiz[i][3].map((_,j)=&gt;j))),answers:{},submitted:{},index:0,done:false,deadline:mode===&#x27;exam&#x27;?Date.now()+50*60*1000:null};
    save();render();
  }
  function finish(){
    const q=state.quiz;if(!q||q.done)return;
    q.done=true;
    const correct=q.ids.filter(i=&gt;q.answers[i]===data.quiz[i][4]).length;
    state.lastResult={mode:q.mode,chapter:q.chapter||0,correct,total:q.ids.length,percent:Math.round(correct/q.ids.length*100)};
    if(q.mode===&#x27;chapter&#x27;) state.chapterResults[q.chapter]={...state.lastResult};
    save();render();
  }
  function renderQuizMenu(){
    const topics=[
      &#x27;Forensic principles, evidence, custody, expert reports and testimony, evidence rules, Daubert, hardware, file systems, networking, anti-forensics, and legal topics.&#x27;,
      &#x27;Device roles, identity theft, phishing, spyware, SQL injection, XSS, password attacks, social engineering, cyberstalking, fraud, DoS, malware, and cyberterrorism.&#x27;,
      &#x27;Methods, authentication, volatility, frameworks, finding/preserving/preparing evidence, slack calculations, documentation, lab security, standards, tools, and certifications.&#x27;,
      &#x27;Steganography and tools, classical ciphers and Playfair examples, symmetric/asymmetric systems, DES/3DES/AES, hashes, RSA, Diffie–Hellman, cryptanalysis, passwords, and quantum threats.&#x27;
    ];
    panel.innerHTML=`&lt;h3&gt;Choose your chapter quiz&lt;/h3&gt;&lt;p&gt;Each chapter quiz asks every question in its chapter bank, in a shuffled order. These quizzes are untimed. Check answers as you go, or wait until the end. Explanations include chapter page references.&lt;/p&gt;
    ${state.quiz&amp;&amp;!state.quiz.done?`&lt;div class=&quot;study-block&quot;&gt;${button(&#x27;Resume unfinished quiz&#x27;,&#x27;resume&#x27;,true)}&lt;p class=&quot;text-small&quot;&gt;Starting another quiz replaces the unfinished set. Your flashcard progress and completed chapter scores stay saved.&lt;/p&gt;&lt;/div&gt;`:&#x27;&#x27;}
    ${[1,2,3,4].map(ch=&gt;{const count=data.quiz.filter(q=&gt;q[0]===ch).length;const result=state.chapterResults[ch];return `&lt;section class=&quot;study-block&quot;&gt;&lt;h3&gt;Chapter ${ch} · ${esc(data.chapters[ch-1])}&lt;/h3&gt;&lt;p&gt;${topics[ch-1]}&lt;/p&gt;&lt;p&gt;${count} questions · Untimed${result?` · Last score: ${result.correct}/${result.total} (${result.percent}%)`:&#x27;&#x27;}&lt;/p&gt;${button(`Start Chapter ${ch} quiz`,&#x27;chapter&#x27;,false,`data-chapter=&quot;${ch}&quot;`)}&lt;/section&gt;`;}).join(&#x27;&#x27;)}
    &lt;hr&gt;&lt;h3&gt;Mixed practice &amp; exam timing&lt;/h3&gt;&lt;div class=&quot;viz-row&quot;&gt;${button(&#x27;10-question mixed practice&#x27;,&#x27;practice&#x27;)}${button(&#x27;25-question mock · 50 min&#x27;,&#x27;exam&#x27;)}&lt;/div&gt;
    &lt;p class=&quot;text-small&quot;&gt;Mixed practice samples all four chapters. The mock exam uses 6 questions each from Chapters 1–3 and 7 from Chapter 4 and withholds explanations until submission. There are ${data.quiz.length} questions in total. Questions cover the chapter topics, but are not an instructor-issued list of everything that can appear on the exam.&lt;/p&gt;`;
  }
  function renderQuiz(){
    const q=state.quiz;
    if(!q||state.quizMenu){renderQuizMenu();return;}
    if(q.done){renderResults();return;}
    if(q.deadline&amp;&amp;Date.now()&gt;=q.deadline){finish();return;}
    const id=q.ids[q.index], item=data.quiz[id], selected=q.answers[id];
    const checked=!!q.submitted[id];
    const answered=Object.keys(q.answers).length;
    panel.innerHTML=`&lt;div class=&quot;viz-row&quot;&gt;&lt;span&gt;${q.mode===&#x27;exam&#x27;?&#x27;Mock exam&#x27;:q.mode===&#x27;chapter&#x27;?`Chapter ${q.chapter} quiz`:&#x27;Mixed practice&#x27;} · Question ${q.index+1}/${q.ids.length}&lt;/span&gt;&lt;span&gt;${answered} answered&lt;/span&gt;${q.deadline?&#x27;&lt;span id=&quot;exam-clock&quot; class=&quot;tabular-nums&quot; role=&quot;timer&quot;&gt;&lt;/span&gt;&#x27;:&#x27;&#x27;}&lt;/div&gt;
    &lt;h3&gt;${esc(item[2])}&lt;/h3&gt;&lt;fieldset class=&quot;study-options&quot;&gt;&lt;legend class=&quot;sr-only&quot;&gt;Choose an answer&lt;/legend&gt;${q.orders[q.index].map(j=&gt;`&lt;label class=&quot;form-check&quot;&gt;&lt;input class=&quot;form-check-input&quot; type=&quot;radio&quot; name=&quot;quiz-answer&quot; value=&quot;${j}&quot; ${selected===j?&#x27;checked&#x27;:&#x27;&#x27;} ${checked?&#x27;disabled&#x27;:&#x27;&#x27;}&gt;&lt;span class=&quot;form-check-label&quot;&gt;${esc(item[3][j])}&lt;/span&gt;&lt;/label&gt;`).join(&#x27;&#x27;)}&lt;/fieldset&gt;
    &lt;div aria-live=&quot;polite&quot;&gt;${checked?`&lt;p&gt;${selected===item[4]?&#x27;Correct.&#x27;:&#x27;Not quite.&#x27;} ${esc(item[5])}&lt;/p&gt;&lt;p&gt;Correct answer: ${esc(item[3][item[4]])}&lt;/p&gt;${source(item[0],item[1])}`:&#x27;&#x27;}&lt;/div&gt;
    &lt;div class=&quot;viz-row&quot;&gt;${q.mode!==&#x27;exam&#x27;&amp;&amp;!checked?button(&#x27;Check answer&#x27;,&#x27;check&#x27;,true,selected===undefined?&#x27;disabled&#x27;:&#x27;&#x27;):&#x27;&#x27;}${button(&#x27;Previous&#x27;,&#x27;prev-q&#x27;,false,q.index===0?&#x27;disabled&#x27;:&#x27;&#x27;)}${button(&#x27;Next&#x27;,&#x27;next-q&#x27;,false,q.index===q.ids.length-1?&#x27;disabled&#x27;:&#x27;&#x27;)}${button(q.mode===&#x27;exam&#x27;?&#x27;Submit exam&#x27;:&#x27;Finish &amp; review&#x27;,&#x27;finish&#x27;,q.mode===&#x27;exam&#x27;||checked)}${button(&#x27;Quiz menu&#x27;,&#x27;quiz-menu&#x27;)}&lt;/div&gt;
    &lt;p class=&quot;text-small&quot;&gt;${q.mode===&#x27;exam&#x27;?&#x27;You can change answers before submitting. Unanswered questions count as incorrect. The timer continues if you switch study sections or close the view.&#x27;:&#x27;Choose an answer and check it for feedback, or finish to see your overall review.&#x27;}&lt;/p&gt;`;
    if(q.deadline){const tick=()=&gt;{const remaining=Math.max(0,Math.ceil((q.deadline-Date.now())/1000));const el=root.querySelector(&#x27;#exam-clock&#x27;);if(el)el.textContent=`${Math.floor(remaining/60)}:${String(remaining%60).padStart(2,&#x27;0&#x27;)} remaining`;if(remaining===0)finish();};tick();timer=setInterval(tick,1000);}
  }
  function renderResults(){
    const q=state.quiz;
    const score=q.ids.filter(i=&gt;q.answers[i]===data.quiz[i][4]).length;
    const wrong=q.ids.filter(i=&gt;q.answers[i]!==data.quiz[i][4]);
    const chapters=[...new Set(q.ids.map(i=&gt;data.quiz[i][0]))].sort();
    panel.innerHTML=`&lt;div class=&quot;text-small&quot;&gt;${q.mode===&#x27;chapter&#x27;?`Chapter ${q.chapter} quiz`:q.mode===&#x27;exam&#x27;?&#x27;Mock exam&#x27;:&#x27;Mixed practice&#x27;}&lt;/div&gt;&lt;h3&gt;${score}/${q.ids.length} correct · ${Math.round(score/q.ids.length*100)}%&lt;/h3&gt;&lt;p&gt;${wrong.length?`Review the ${wrong.length} missed or unanswered questions below, then return to those chapter pages.`:&#x27;All correct in this set. Explain the reasoning without the choices, then try a new set.&#x27;}&lt;/p&gt;
    &lt;div class=&quot;viz-row&quot;&gt;${chapters.map(ch=&gt;{const ids=q.ids.filter(i=&gt;data.quiz[i][0]===ch);return `&lt;span&gt;Chapter ${ch}: ${ids.filter(i=&gt;q.answers[i]===data.quiz[i][4]).length}/${ids.length}&lt;/span&gt;`;}).join(&#x27;&#x27;)}&lt;/div&gt;
    &lt;div class=&quot;viz-row&quot;&gt;${button(&#x27;Choose another set&#x27;,&#x27;new-set&#x27;,true)}&lt;/div&gt;
    ${q.ids.map((id,i)=&gt;{const item=data.quiz[id], correct=q.answers[id]===item[4];return `&lt;details class=&quot;study-block&quot; ${correct?&#x27;&#x27;:&#x27;open&#x27;}&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;${correct?&#x27;Correct&#x27;:&#x27;Review&#x27;} · ${i+1}. ${esc(item[2])}&lt;/summary&gt;&lt;p&gt;Your answer: ${q.answers[id]===undefined?&#x27;Unanswered&#x27;:esc(item[3][q.answers[id]])}&lt;/p&gt;&lt;p&gt;Correct answer: ${esc(item[3][item[4]])}&lt;/p&gt;&lt;p&gt;${esc(item[5])}&lt;/p&gt;${source(item[0],item[1])}&lt;/details&gt;`;}).join(&#x27;&#x27;)}`;
  }
  root.addEventListener(&#x27;change&#x27;,e=&gt;{
    const el=e.target;
    if(el===chapterChoice){state.chapter=Number(el.value);state.cardIndex=0;revealed=false;save();render();}
    if(el.id===&#x27;deck-mode&#x27;){state.deckMode=el.value;state.cardIndex=0;revealed=false;save();render();}
    if(el.dataset.check!==undefined){const id=Number(el.dataset.check);state.checks=state.checks.filter(x=&gt;x!==id);if(el.checked)state.checks.push(id);save();}
    if(el.dataset.read!==undefined){const ch=Number(el.dataset.read);state.read=state.read.filter(x=&gt;x!==ch);if(el.checked)state.read.push(ch);save();}
    if(el.name===&#x27;quiz-answer&#x27;&amp;&amp;state.quiz&amp;&amp;!state.quiz.done){state.quiz.answers[state.quiz.ids[state.quiz.index]]=Number(el.value);save();render();}
  });
  root.addEventListener(&#x27;click&#x27;,e=&gt;{
    const b=e.target.closest(&#x27;button&#x27;);if(!b||b.disabled)return;
    if(b.dataset.view){state.view=b.dataset.view;if(state.view===&#x27;quiz&#x27;)state.quizMenu=true;save();render();return;}
    const a=b.dataset.action;
    if(a===&#x27;mixed&#x27;){state.view=&#x27;quiz&#x27;;state.chapter=0;if(!state.quiz||state.quiz.done)startQuiz(&#x27;practice&#x27;);else {state.quizMenu=true;render();}}
    if(a===&#x27;read-first&#x27;){state.view=&#x27;read&#x27;;state.chapter=1;render();}
    if(a===&#x27;reveal&#x27;){revealed=true;renderCards();}
    if(a===&#x27;prev-card&#x27;||a===&#x27;next-card&#x27;){state.cardIndex+=a===&#x27;prev-card&#x27;?-1:1;revealed=false;renderCards();}
    if(a===&#x27;again&#x27;||a===&#x27;known&#x27;){
      const ids=cardIds(), id=ids[state.cardIndex];if(id!==undefined)state.marks[id]=a;
      if(!(state.deckMode===&#x27;again&#x27;&amp;&amp;a===&#x27;known&#x27;))state.cardIndex=(state.cardIndex+1)%ids.length;
      revealed=false;renderCards();
    }
    if(a===&#x27;practice&#x27;||a===&#x27;exam&#x27;)startQuiz(a);
    if(a===&#x27;chapter&#x27;)startQuiz(&#x27;chapter&#x27;,Number(b.dataset.chapter));
    if(a===&#x27;quiz-menu&#x27;){state.quizMenu=true;render();}
    if(a===&#x27;resume&#x27;){state.quizMenu=false;render();}
    if(a===&#x27;check&#x27;){const q=state.quiz,id=q.ids[q.index];if(q.answers[id]!==undefined)q.submitted[id]=true;render();}
    if(a===&#x27;prev-q&#x27;||a===&#x27;next-q&#x27;){state.quiz.index+=a===&#x27;prev-q&#x27;?-1:1;render();}
    if(a===&#x27;finish&#x27;)finish();
    if(a===&#x27;new-set&#x27;){state.quiz=null;state.quizMenu=true;render();}
    save();
  });
  render();
})();
&lt;/script&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;
  let lastPointerWasTouch = false;
  let pinnedByTouch = false;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );

    }

    }
  };

    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    pinnedByTouch = false;
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;

    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
