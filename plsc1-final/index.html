<!DOCTYPE html>
<html lang="en">
<head>

  <title>PLSC 1 Final Practice</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='10' fill='%232563eb'/%3E%3Ctext x='32' y='41' font-size='28' text-anchor='middle' fill='white' font-family='Arial' font-weight='700'%3EP1%3C/text%3E%3C/svg%3E">
  <style>
    :root {
      --ink: #172033;
      --muted: #637089;
      --paper: #fffdfa;
      --line: #d7deea;
      --blue: #2563eb;
      --blue-soft: #dce8ff;
      --green: #15803d;
      --green-soft: #dff5e8;
      --gold: #a16207;
      --gold-soft: #fff2c9;
      --red: #b91c1c;
      --red-soft: #ffe1e1;
      --shadow: 0 18px 45px rgba(32, 44, 72, 0.14);
      --radius: 8px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background: linear-gradient(180deg, #edf4ff 0%, #f7f0df 54%, #eef7f0 100%);
      font-family: Inter, "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    }
    button, input, select { font: inherit; }
    .app { width: min(1120px, 100%); margin: 0 auto; padding: 18px 14px 40px; }
    header { padding: 10px 0 18px; display: grid; gap: 12px; }
    .topline { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; color: var(--muted); font-size: 0.93rem; }
    h1 { margin: 0; font-size: clamp(2rem, 7vw, 4.4rem); line-height: 0.98; letter-spacing: 0; max-width: 860px; }
    .summary { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin: 8px 0 14px; }
    .metric { background: rgba(255, 253, 250, 0.9); border: 1px solid rgba(215, 222, 234, 0.9); border-radius: var(--radius); padding: 13px; box-shadow: 0 8px 24px rgba(32, 44, 72, 0.08); }
    .metric strong { display: block; font-size: 1.42rem; line-height: 1; margin-bottom: 5px; }
    .metric span { color: var(--muted); font-size: 0.9rem; }
    .panel { background: rgba(255, 253, 250, 0.96); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
    .controls { padding: 12px; display: grid; gap: 12px; margin-bottom: 12px; position: sticky; top: 0; z-index: 10; }
    .row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
    .row.spread { justify-content: space-between; }
    .segmented, .chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .tab, .chip, .btn, .option, select, input[type="search"] { border: 1px solid var(--line); border-radius: 999px; background: #ffffff; color: var(--ink); padding: 10px 14px; }
    .tab, .chip, .btn, .option { cursor: pointer; }
    .tab.active, .chip.active { color: #ffffff; border-color: var(--blue); background: var(--blue); }
    .btn.primary { background: var(--ink); color: #ffffff; border-color: var(--ink); }
    .btn.good { background: var(--green-soft); color: var(--green); border-color: #9eddb4; }
    .btn.warn { background: var(--gold-soft); color: var(--gold); border-color: #f2d67d; }
    .btn.danger { background: var(--red-soft); color: var(--red); border-color: #f3adad; }
    input[type="search"] { min-width: min(100%, 280px); flex: 1 1 280px; }
    main.panel { padding: 14px; }
    .card-head { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; color: var(--muted); margin-bottom: 12px; font-size: 0.92rem; }
    .badge { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 6px 10px; background: var(--blue-soft); color: #174ea6; font-weight: 700; white-space: nowrap; }
    .question { margin: 0 0 16px; font-size: clamp(1.12rem, 4.2vw, 1.65rem); line-height: 1.35; letter-spacing: 0; }
    .options { display: grid; gap: 9px; }
    .option { width: 100%; text-align: left; border-radius: var(--radius); display: grid; grid-template-columns: 34px 1fr; gap: 10px; align-items: start; line-height: 1.45; background: #fff; }
    .option.selected { border-color: var(--blue); background: #eef5ff; box-shadow: inset 0 0 0 1px var(--blue); }
    .letter { display: inline-grid; place-items: center; width: 30px; height: 30px; border-radius: 999px; color: #ffffff; background: var(--ink); font-weight: 800; }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
    .flash-wrap { min-height: 370px; perspective: 1300px; }
    .flash-card { min-height: 370px; border: 1px solid var(--line); border-radius: var(--radius); background: linear-gradient(145deg, #ffffff, #f7fbff); transform-style: preserve-3d; transition: transform 0.34s ease; position: relative; cursor: pointer; }
    .flash-card.flipped { transform: rotateY(180deg); }
    .face { position: absolute; inset: 0; padding: 20px; backface-visibility: hidden; overflow: auto; display: flex; flex-direction: column; justify-content: center; gap: 16px; }
    .back { transform: rotateY(180deg); }
    .face .question { font-size: clamp(1.35rem, 5vw, 2rem); }
    .list { display: grid; gap: 8px; }
    .list-card { display: grid; gap: 8px; padding: 14px; border: 1px solid var(--line); border-radius: var(--radius); background: #ffffff; margin-bottom: 10px; }
    .list-card h3 { margin: 0; font-size: 1rem; line-height: 1.4; }
    .list-card ol { margin: 0; padding-left: 24px; color: var(--muted); }
    .empty { text-align: center; padding: 34px 12px; color: var(--muted); }
    @media (max-width: 760px) {
      .app { padding: 12px 10px 28px; }
      .summary { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .controls { position: static; }
      .row.spread { align-items: stretch; }
      .segmented, .chips, .row { width: 100%; }
      .tab, .chip, .btn { flex: 1 1 auto; text-align: center; }
      main.panel { padding: 12px; }
      .option { grid-template-columns: 30px 1fr; padding: 10px; }
      .face { padding: 16px; }
    }
  </style>
</head>

English word derives from the ancient Greek words for \&quot;people\&quot; and \&quot;rule\&quot;?&quot;,&quot;options&quot;:[{&quot;label&quot;:&quot;A&quot;,&quot;text&quot;:&quot;republic&quot;},{&quot;label&quot;:&quot;B&quot;,&quot;text&quot;:&quot;politics&quot;},{&quot;label&quot;:&quot;C&quot;,&quot;text&quot;:&quot;communism&quot;},{&quot;label&quot;:&quot;D&quot;,&quot;text&quot;:&quot;democracy&quot;},{&quot;label&quot;:&quot;E&quot;,&quot;text&quot;:&quot;liberalism&quot;}]},{&quot;id&quot;:&quot;exam1-4&quot;,&quot;exam&quot;:&quot;Exam 1&quot;,&quot;examId&quot;:&quot;exam1&quot;,&quot;number&quot;:4,&quot;question&quot;:&quot;The Declaration of Independence asserts that humans have \&quot;certain unalienable rights\&quot; including:&quot;,&quot;options&quot;:[{&quot;label&quot;:&quot;A&quot;,&quot;text&quot;:&quot;life, liberty, and the pursuit of happiness&quot;},{&quot;label&quot;:&quot;B&quot;,&quot;text&quot;:&quot;due process and equal protection under the law&quot;},{&quot;label&quot;:&quot;C&quot;,&quot;text&quot;:&quot;justice, domestic tranquility, and general welfare&quot;},{&quot;label&quot;:&quot;D&quot;,&quot;text&quot;:&quot;substantive and procedural due process&quot;},{&quot;label&quot;:&quot;E&quot;,&quot;text&quot;:&quot;freedom, justice, and peace in the world&quot;}]},{&quot;id&quot;:&quot;exam1-5&quot;,&quot;exam&quot;:&quot;Exam 1&quot;,&quot;examId&quot;:&quot;exam1&quot;,&quot;number&quot;:5,&quot;question&quot;:&quot;This prominent Federalist was the longest serving Supreme Court chief justice ever (1801-1835). His decisions helped establish the legal foundation for federal supremacy. He was:&quot;,&quot;options&quot;:[{&quot;label&quot;:&quot;A&quot;,&quot;text&quot;:&quot;Alexander Hamilton&quot;},{&quot;label&quot;:&quot;B&quot;,&quot;text&quot;:&quot;Aaron Burr&quot;},{&quot;label&quot;:&quot;C&quot;,&quot;text&quot;:&quot;John Jay&quot;},{&quot;label&quot;:&quot;D&quot;,&quot;text&quot;:&quot;James Madison&quot;},{&quot;label&quot;:&quot;E&quot;,&quot;text&quot;:&quot;none of the above&quot;}]},{&quot;id&quot;:&quot;exam1-6&quot;,&quot;exam&quot;:&quot;Exam 1&quot;,&quot;examId&quot;:&quot;exam1&quot;,&quot;number&quot;:6,&quot;question&quot;:&quot;The 1954 Supreme Court decision in Brown v Board of Education dealt with which of the following:&quot;,&quot;options&quot;:[{&quot;label&quot;:&quot;A&quot;,&quot;text&quot;:&quot;interstate commerce&quot;},{&quot;label&quot;:&quot;B&quot;,&quot;text&quot;:&quot;de jure segregation&quot;},{&quot;label&quot;:&quot;C&quot;,&quot;text&quot;:&quot;intrastate commerce&quot;},{&quot;label&quot;:&quot;D&quot;,&quot;text&quot;:&quot;de facto segregation&quot;},{&quot;label&quot;:&quot;E&quot;,&quot;text&quot;:&quot;none of the above&quot;}]},{&quot;id&quot;:&quot;exam1-7&quot;,&quot;exam&quot;:&quot;Exam 1&quot;,&quot;examId&quot;:&quot;exam1&quot;,&quot;number&quot;:7,&quot;question&quot;:&quot;The Supreme Court&#x27;s decision in the 1824 case of Gibbons v Ogden involving steamboats dealt with:&quot;,&quot;options&quot;:[{&quot;label&quot;:&quot;A&quot;,&quot;text&quot;:&quot;freedom of religion&quot;},{&quot;label&quot;:&quot;B&quot;,&quot;text&quot;:&quot;freedom of speech&quot;},{&quot;label&quot;:&quot;C&quot;,&quot;text&quot;:&quot;interstate commerce&quot;},{&quot;label&quot;:&quot;D&quot;,&quot;text&quot;:&quot;the full faith and credit clause&quot;},{&quot;label&quot;:&quot;E&quot;,&quot;text&quot;:&quot;privileges and immunities&quot;}]},{&quot;id&quot;:&quot;exam1-8&quot;,&quot;exam&quot;:&quot;Exam 1&quot;,&quot;examId&quot;:&quot;exam1&quot;,&quot;number&quot;:8,&quot;question&quot;:&quot;The theory that holds that the 14th amendment&#x27;s due process language ensures not only procedural rights for individuals but also protects corporations from unwarranted governmental regulation is called:&quot;,&quot;options&quot;:[{&quot;label&quot;:&quot;A&quot;,&quot;text&quot;:&quot;bicameralism&quot;},{&quot;label&quot;:&quot;B&quot;,&quot;text&quot;:&quot;cooperative federalism&quot;},{&quot;label&quot;:&quot;C&quot;,&quot;text&quot;:&quot;substantive due process&quot;},{&quot;label&quot;:&quot;D&quot;,&quot;text&quot;:&quot;corporative due process&quot;},{&quot;label&quot;:&quot;E&quot;,&quot;text&quot;:&quot;dual federalism&quot;}]},{&quot;id&quot;:&quot;exam1-9&quot;,&quot;exam&quot;:&quot;Exam 1&quot;,&quot;examId&quot;:&quot;exam1&quot;,&quot;number&quot;:9,&quot;question&quot;:&quot;The Voting Rights Act of 1965 sought to enforce:&quot;,&quot;options&quot;:[{&quot;label&quot;:&quot;A&quot;,&quot;text&quot;:&quot;the 1st Amendment&quot;},{&quot;label&quot;:&quot;B&quot;,&quot;text&quot;:&quot;the 10th Amendment&quot;},{&quot;label&quot;:&quot;C&quot;,&quot;text&quot;:&quot;the 11th Amendment&quot;},{&quot;label&quot;:&quot;D&quot;,&quot;text&quot;:&quot;the 15th Amendment&quot;},{&quot;label&quot;:&quot;E&quot;,&quot;text&quot;:&quot;the 16th Amendment&quot;}]},{&quot;id&quot;:&quot;exam1-10&quot;,&quot;exam&quot;:&quot;Exam 1&quot;,&quot;examId&quot;:&quot;exam1&quot;,&quot;number&quot;:10,&quot;question&quot;:&quot;The movement of large numbers of African Americans from southern states into northern states during the first half of the 20th century is known as:&quot;,&quot;options&quot;:[{&quot;label&quot;:&quot;A&quot;,&quot;text&quot;:&quot;the Great Awakening&quot;},{&quot;label&quot;:&quot;B&quot;,&quot;text&quot;:&quot;the McCarthy Movement&quot;},{&quot;label&quot;:&quot;C&quot;,&quot;text&quot;:&quot;the Great Migration&quot;},{&quot;label&quot;:&quot;D&quot;,&quot;text&quot;:&quot;the Exodus&quot;},{&quot;label&quot;:&quot;E&quot;,&quot;text&quot;:&quot;none of the above&quot;}]},{&quot;id&quot;:&quot;exam1-11&quot;,&quot;exam&quot;:&quot;Exam 1&quot;,&quot;examId&quot;:&quot;exam1&quot;,&quot;number&quot;:11,&quot;question&quot;:&quot;This 1905 Supreme Court decision limited the ability of states to control working conditions, in particular striking down as unconstitutional a law establishing a 60-hour work week for bakers:&quot;,&quot;options&quot;:[{&quot;label&quot;:&quot;A&quot;,&quot;text&quot;:&quot;Lochner v New York&quot;},{&quot;label&quot;:&quot;B&quot;,&quot;text&quot;:&quot;U.S. v Carolene Products&quot;},{&quot;label&quot;:&quot;C&quot;,&quot;text&quot;:&quot;Marbury v Madison&quot;},{&quot;label&quot;:&quot;D&quot;,&quot;text&quot;:&quot;McCulloch v Maryland&quot;},{&quot;label&quot;:&quot;E&quot;,&quot;text&quot;:&quot;none of the above&quot;}]},{&quot;id&quot;:&quot;exam1-12&quot;,&quot;exam&quot;:&quot;Exam 1&quot;,&quot;examId&quot;:&quot;exam1&quot;,&quot;number&quot;:12,&quot;question&quot;:&quot;Generally speaking, America has lacked a feudal tradition, except:&quot;,&quot;options&quot;:[{&quot;label&quot;:&quot;A&quot;,&quot;text&quot;:&quot;on Wall Street&quot;},{&quot;label&quot;:&quot;B&quot;,&quot;text&quot;:&quot;in the South&quot;},{&quot;label&quot;:&quot;C&quot;,&quot;text&quot;:&quot;in dealings with Native Americans&quot;},{&quot;label&quot;:&quot;D&quot;,&quot;text&quot;:&quot;during wartime&quot;},{&quot;label&quot;:&quot;E&quot;,&quot;text&quot;:&quot;in New England&quot;}]},{&quot;id&quot;:&quot;exam1-13&quot;,&quot;exam&quot;:&quot;Exam 1&quot;,&quot;examId&quot;:&quot;exam1&quot;,&quot;number&quot;:13,&quot;question&quot;:&quot;The constitutional basis for the Civil Rights Act of 1964 is the Congress&#x27;s right to regulate:&quot;,&quot;options&quot;:[{&quot;label&quot;:&quot;A&quot;,&quot;text&quot;:&quot;speech&quot;},{&quot;label&quot;:&quot;B&quot;,&quot;text&quot;:&quot;privileges and immunities&quot;},{&quot;label&quot;:&quot;C&quot;,&quot;text&quot;:&quot;voting rights&quot;},{&quot;label&quot;:&quot;D&quot;,&quot;text&quot;:&quot;interstate commerce&quot;},{&quot;label&quot;:&quot;E&quot;,&quot;text&quot;:&quot;the full faith and credit of the states&quot;}]},{&quot;id&quot;:&quot;exam1-14&quot;,&quot;exam&quot;:&quot;Exam 1&quot;,&quot;examId&quot;:&quot;exam1&quot;,&quot;number&quot;:14,&quot;quest esumptive power&quot;},{&quot;label&quot;:&quot;C&quot;,&quot;text&quot;:&quot;discretionary authority&quot;},{&quot;label&quot;:&quot;D&quot;,&quot;text&quot;:&quot;executive privilege&quot;},{&quot;label&quot;:&quot;E&quot;,&quot;text&quot;:&quot;none of the above&quot;}]},{&quot;id&quot;:&quot;exam3-34&quot;,&quot;exam&quot;:&quot;Exam 3&quot;,&quot;examId&quot;:&quot;exam3&quot;,&quot;number&quot;:34,&quot;question&quot;:&quot;The acronym OMB stands for:&quot;,&quot;options&quot;:[{&quot;label&quot;:&quot;A&quot;,&quot;text&quot;:&quot;Office of Military Balance&quot;},{&quot;label&quot;:&quot;B&quot;,&quot;text&quot;:&quot;Omnibus Medical (Insurance) Bill&quot;},{&quot;label&quot;:&quot;C&quot;,&quot;text&quot;:&quot;Office of Management and Budget&quot;},{&quot;label&quot;:&quot;D&quot;,&quot;text&quot;:&quot;Omnipresent Military Bases&quot;},{&quot;label&quot;:&quot;E&quot;,&quot;text&quot;:&quot;none of the above&quot;}]},{&quot;id&quot;:&quot;exam3-35&quot;,&quot;exam&quot;:&quot;Exam 3&quot;,&quot;examId&quot;:&quot;exam3&quot;,&quot;number&quot;:35,&quot;question&quot;:&quot;The Latin term for abiding by the precedents set in earlier judicial decisions is:&quot;,&quot;options&quot;:[{&quot;label&quot;:&quot;A&quot;,&quot;text&quot;:&quot;stare decisis&quot;},{&quot;label&quot;:&quot;B&quot;,&quot;text&quot;:&quot;habeas corpus&quot;},{&quot;label&quot;:&quot;C&quot;,&quot;text&quot;:&quot;per curiam&quot;},{&quot;label&quot;:&quot;D&quot;,&quot;text&quot;:&quot;certiorari&quot;},{&quot;label&quot;:&quot;E&quot;,&quot;text&quot;:&quot;none of the above&quot;}]},{&quot;id&quot;:&quot;exam3-36&quot;,&quot;exam&quot;:&quot;Exam 3&quot;,&quot;examId&quot;:&quot;exam3&quot;,&quot;number&quot;:36,&quot;question&quot;:&quot;In terms of traits such as gender, race, and class, which of the following is most representative of the American population:&quot;,&quot;options&quot;:[{&quot;label&quot;:&quot;A&quot;,&quot;text&quot;:&quot;Senate&quot;},{&quot;label&quot;:&quot;B&quot;,&quot;text&quot;:&quot;House of Representatives&quot;},{&quot;label&quot;:&quot;C&quot;,&quot;text&quot;:&quot;presidency&quot;},{&quot;label&quot;:&quot;D&quot;,&quot;text&quot;:&quot;bureaucracy&quot;},{&quot;label&quot;:&quot;E&quot;,&quot;text&quot;:&quot;Supreme Court&quot;}]},{&quot;id&quot;:&quot;exam3-37&quot;,&quot;exam&quot;:&quot;Exam 3&quot;,&quot;examId&quot;:&quot;exam3&quot;,&quot;number&quot;:37,&quot;question&quot;:&quot;Name the German sociologist who was among the first to recognize the importance of bureaucratization in modern societies:&quot;,&quot;options&quot;:[{&quot;label&quot;:&quot;A&quot;,&quot;text&quot;:&quot;Albert Speer&quot;},{&quot;label&quot;:&quot;B&quot;,&quot;text&quot;:&quot;Conrad Adenauer&quot;},{&quot;label&quot;:&quot;C&quot;,&quot;text&quot;:&quot;Max Weber&quot;},{&quot;label&quot;:&quot;D&quot;,&quot;text&quot;:&quot;Erwin Rommel&quot;},{&quot;label&quot;:&quot;E&quot;,&quot;text&quot;:&quot;Alexis de Tocqueville&quot;}]},{&quot;id&quot;:&quot;exam3-38&quot;,&quot;exam&quot;:&quot;Exam 3&quot;,&quot;examId&quot;:&quot;exam3&quot;,&quot;number&quot;:38,&quot;question&quot;:&quot;Informal monitoring of bureaucratic behavior by interest groups and private citizens who complain when there are problems is called:&quot;,&quot;options&quot;:[{&quot;label&quot;:&quot;A&quot;,&quot;text&quot;:&quot;fire alarm oversight&quot;},{&quot;label&quot;:&quot;B&quot;,&quot;text&quot;:&quot;police patrol oversight&quot;},{&quot;label&quot;:&quot;C&quot;,&quot;text&quot;:&quot;EMT oversight&quot;},{&quot;label&quot;:&quot;D&quot;,&quot;text&quot;:&quot;ER oversight&quot;},{&quot;label&quot;:&quot;E&quot;,&quot;text&quot;:&quot;none of the above&quot;}]},{&quot;id&quot;:&quot;exam3-39&quot;,&quot;exam&quot;:&quot;Exam 3&quot;,&quot;examId&quot;:&quot;exam3&quot;,&quot;number&quot;:39,&quot;question&quot;:&quot;Charles Guiteau is an important figure in American political history because he:&quot;,&quot;options&quot;:[{&quot;label&quot;:&quot;A&quot;,&quot;text&quot;:&quot;chaired a commission calling for greater resources in the executive office of the president&quot;},{&quot;label&quot;:&quot;B&quot;,&quot;text&quot;:&quot;led the \&quot;revolt\&quot; against the speaker of the House in 1910&quot;},{&quot;label&quot;:&quot;C&quot;,&quot;text&quot;:&quot;was the admiral of the \&quot;Great White Fleet\&quot; during the presidency of Theodore Roosevelt&quot;},{&quot;label&quot;:&quot;D&quot;,&quot;text&quot;:&quot;assassinated President James Garfield, triggering reforms in federal government employment&quot;},{&quot;label&quot;:&quot;E&quot;,&quot;text&quot;:&quot;none of the above&quot;}]},{&quot;id&quot;:&quot;exam3-40&quot;,&quot;exam&quot;:&quot;Exam 3&quot;,&quot;examId&quot;:&quot;exam3&quot;,&quot;number&quot;:40,&quot;question&quot;:&quot;According to research by Marvin Overby, among members of the House of Representatives, who tend to retire in higher numbers:&quot;,&quot;options&quot;:[{&quot;label&quot;:&quot;A&quot;,&quot;text&quot;:&quot;Republican members&quot;},{&quot;label&quot;:&quot;B&quot;,&quot;text&quot;:&quot;Democratic members&quot;},{&quot;label&quot;:&quot;C&quot;,&quot;text&quot;:&quot;rank and file members of both parties&quot;},{&quot;label&quot;:&quot;D&quot;,&quot;text&quot;:&quot;leaders of both parties&quot;},{&quot;label&quot;:&quot;E&quot;,&quot;text&quot;:&quot;independent members&quot;}]}]}</script>
  <script>
    const STORAGE_KEY = "plsc1-final-progress-v1";
    let allQuestions = [];
    let state = { mode: "quiz", exam: "all", query: "", index: 0, order: [], selected: {}, flipped: false, progress: {} };
    const stage = document.getElementById("stage");
    const search = document.getElementById("search");
    const jump = document.getElementById("jump");
    function loadSaved() { try { const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}"); state.selected = saved.selected || {}; state.progress = saved.progress || {}; } catch (_) {} }
    function save() { localStorage.setItem(STORAGE_KEY, JSON.stringify({ selected: state.selected, progress: state.progress })); document.getElementById("savedStatus").textContent = "Saved " + new Date().toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }); renderStats(); }
    function filteredQuestions() { const query = state.query.trim().toLowerCase(); return state.order.map(i => allQuestions[i]).filter(q => { if (state.exam === "review" && state.progress[q.id] !== "review") return false; if (state.exam !== "all" && state.exam !== "review" && q.examId !== state.exam) return false; if (!query) return true; const haystack = [q.exam, q.number, q.question, ...q.options.map(o => o.label + " " + o.text)].join(" ").toLowerCase(); return haystack.includes(query); }); }
    function currentQuestion() { const list = filteredQuestions(); if (!list.length) return null; if (state.index >= list.length) state.index = 0; if (state.index < 0) state.index = list.length - 1; return list[state.index]; }
    function markSeen(q, status) { state.progress[q.id] = status; save(); render(); }
    function renderStats() { const ids = new Set(allQuestions.map(q => q.id)); const values = Object.entries(state.progress).filter(([id]) => ids.has(id)).map(([, status]) => status); document.getElementById("totalCount").textContent = allQuestions.length; document.getElementById("seenCount").textContent = values.length; document.getElementById("gotCount").textContent = values.filter(v => v === "got").length; document.getElementById("reviewCount").textContent = values.filter(v => v === "review").length; }
    function renderJump() { const list = filteredQuestions(); jump.innerHTML = list.map((q, i) => `<option value="${i}">${q.exam} #${q.number}</option>`).join(""); jump.value = String(Math.min(state.index, Math.max(list.length - 1, 0))); }
    function renderQuiz(q) { const selected = state.selected[q.id]; stage.innerHTML = `<div class="card-head"><span class="badge">${q.exam} #${q.number}</span><span>${state.index + 1} of ${filteredQuestions().length}</span></div><h2 class="question">${escapeHtml(q.question)}</h2><div class="options">${q.options.map(o => `<button class="option ${selected === o.label ? "selected" : ""}" type="button" data-choice="${o.label}"><span class="letter">${o.label}</span><span>${escapeHtml(o.text)}</span></button>`).join("")}</div><div class="actions"><button class="btn good" type="button" data-mark="got">Got it</button><button class="btn warn" type="button" data-mark="review">Review</button><button class="btn" type="button" data-nav="prev">Previous</button><button class="btn primary" type="button" data-nav="next">Next</button></div>`; stage.querySelectorAll("[data-choice]").forEach(btn => btn.addEventListener("click", () => { state.selected[q.id] = btn.dataset.choice; state.progress[q.id] = state.progress[q.id] || "seen"; save(); render(); })); }
    function renderFlashcard(q) { stage.innerHTML = `<div class="card-head"><span class="badge">${q.exam} #${q.number}</span><span>${state.index + 1} of ${filteredQuestions().length}</span></div><div class="flash-wrap"><article class="flash-card ${state.flipped ? "flipped" : ""}" id="flashCard" tabindex="0"><section class="face front"><p class="badge">Question</p><h2 class="question">${escapeHtml(q.question)}</h2></section><section class="face back"><p class="badge">Options</p><div class="options">${q.options.map(o => `<div class="option"><span class="letter">${o.label}</span><span>${escapeHtml(o.text)}</span></div>`).join("")}</div></section></article></div><div class="actions"><button class="btn primary" type="button" data-flip="1">Flip</button><button class="btn good" type="button" data-mark="got">Got it</button><button class="btn warn" type="button" data-mark="review">Review</button><button class="btn" type="button" data-nav="prev">Previous</button><button class="btn primary" type="button" data-nav="next">Next</button></div>`; document.getElementById("flashCard").addEventListener("click", flipCard); document.querySelector("[data-flip]").addEventListener("click", flipCard); if (state.flipped) { state.progress[q.id] = state.progress[q.id] || "seen"; save(); } }
    function renderList() { const list = filteredQuestions(); stage.innerHTML = list.length ? `<div class="list">${list.map(q => `<article class="list-card"><span class="badge">${q.exam} #${q.number}</span><h3>${escapeHtml(q.question)}</h3><ol type="A">${q.options.map(o => `<li>${escapeHtml(o.text)}</li>`).join("")}</ol></article>`).join("")}</div>` : emptyHtml(); }
    function emptyHtml() { return `<div class="empty">No questions match this filter.</div>`; }
    function render() { renderStats(); renderJump(); const q = currentQuestion(); if (!q && state.mode !== "list") { stage.innerHTML = emptyHtml(); return; } if (state.mode === "quiz") renderQuiz(q); if (state.mode === "flashcards") renderFlashcard(q); if (state.mode === "list") renderList(); stage.querySelectorAll("[data-nav]").forEach(btn => btn.addEventListener("click", () => { const list = filteredQuestions(); state.index = btn.dataset.nav === "next" ? (state.index + 1) % list.length : (state.index - 1 + list.length) % list.length; state.flipped = false; render(); })); stage.querySelectorAll("[data-mark]").forEach(btn => btn.addEventListener("click", () => markSeen(q, btn.dataset.mark))); }
    function flipCard() { state.flipped = !state.flipped; const q = currentQuestion(); if (q) state.progress[q.id] = state.progress[q.id] || "seen"; save(); render(); }
    function shuffle() { for (let i = state.order.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [state.order[i], state.order[j]] = [state.order[j], state.order[i]]; } state.index = 0; state.flipped = false; render(); }
    function escapeHtml(value) { return String(value).replace(/[&<>"']/g, ch => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[ch])); }
    document.querySelectorAll("[data-mode]").forEach(btn => btn.addEventListener("click", () => { document.querySelectorAll("[data-mode]").forEach(b => b.classList.remove("active")); btn.classList.add("active"); state.mode = btn.dataset.mode; state.index = 0; state.flipped = false; render(); }));
    document.querySelectorAll("[data-exam]").forEach(btn => btn.addEventListener("click", () => { document.querySelectorAll("[data-exam]").forEach(b => b.classList.remove("active")); btn.classList.add("active"); state.exam = btn.dataset.exam; state.index = 0; state.flipped = false; render(); }));
    search.addEventListener("input", () => { state.query = search.value; state.index = 0; render(); });
    jump.addEventListener("change", () => { state.index = Number(jump.value) || 0; state.flipped = false; render(); });
    document.getElementById("shuffleBtn").addEventListener("click", shuffle);
    function boot(data) { allQuestions = data.questions; state.order = allQuestions.map((_, i) => i); loadSaved(); render(); }
    fetch("questions.json").then(res => res.ok ? res.json() : Promise.reject(new Error("fetch failed"))).then(boot).catch(() => boot(JSON.parse(document.getElementById("fallback-data").textContent)));
  </script>
